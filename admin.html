<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body{
  margin:0;
  background:#0a0a0a;
  font-family:Arial;
  color:white;
}

/* CENTRADO */
#loadingScreen{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#0a0a0a;
}

/* RUEDA */
.loader {
  width: 80px;
  height: 80px;
  border: 6px solid #222;
  border-top: 6px solid #00ffff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* TEXTO */
h2{
  margin-top:20px;
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- SOLO ESTO -->
<div id="loadingScreen">
  <div class="loader"></div>
  <h2>Volvemos en unos minutos...</h2>
</div>

</body>
</html>
