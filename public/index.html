<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Los Andeleros</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 id="logo">⚡ LOS ANDELEROS</h1>
<h2 id="estado">No logueado</h2>

<!-- MENU -->
<div id="menu">
  <button onclick="mostrarCrear()">Crear cuenta</button>
  <button onclick="mostrarLogin()">Iniciar sesión</button>

  <h3>Cuentas guardadas</h3>
  <div id="listaCuentas"></div>
</div>

<!-- CREAR -->
<div id="crear" class="hidden">
  <input id="apodo" placeholder="Apodo">
  <button onclick="crearCuenta()">Crear</button>
  <button onclick="volver()">Volver</button>
</div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <input id="ide" placeholder="ID">
  <button onclick="loginCuenta()">Entrar</button>
  <button onclick="volver()">Volver</button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">
  <h2>Bienvenido</h2>
  <p>Apodo: <span id="pApodo"></span></p>
</div>

<!-- PERFIL -->
<div id="perfil" class="hidden">
  <h3>Perfil</h3>

  <p>Apodo: <span id="pfApodo"></span></p>
  <p>ID: <span id="pfId"></span></p>

  <button onclick="logout()">Cerrar sesión</button>
  <button onclick="eliminarCuenta()" id="btnEliminar">Eliminar cuenta</button>
  <button onclick="volver()">Volver</button>
</div>

<!-- NOTI -->
<div id="overlayNoti">
  <div class="card">
    <h3>🔔 Notificaciones</h3>
    <p>
      🎮 Pronto minijuegos nuevos<br>
      🔧 Arreglando bugs<br>
      ⚠ Admin abuse cancelado <br>
    </p>
    <button onclick="cerrarNoti()">Cerrar</button>
  </div>
</div>

<!-- MENÚ ENTRAR -->
<div id="menuEntrar" class="hidden">
  <button onclick="irMinijuegos()">Minijuegos</button>
  <button onclick="irEscape()">Escape Room</button>
  <button onclick="irEventos()">Eventos especiales</button>
  <button onclick="cerrarEntrar()">Volver</button>
</div>

<!-- BARRA -->
<div id="barra">
  <button onclick="toggleModo()">Modo</button>
  <button onclick="verPerfil()" id="btnPerfil">Perfil</button>
  <button onclick="abrirNoti()" id="btnNoti">🔔</button>
  <button onclick="abrirEntrar()" id="btnEntrar">Entrar</button>
</div>

<script src="login.js"></script>

</body>
</html>
