  <!-- Sombrilla/Tope -->
  <path d="M 30 15 Q 50 5 70 15 L 65 25 Q 50 20 35 25 Z" fill="#1e40af"/>
  
  <!-- Ojos grandes -->
  <circle cx="42" cy="32" r="4" fill="#fff"/>
