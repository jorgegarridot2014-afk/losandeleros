<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puente de Cristales</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root {
      color-scheme: dark;
      --bg: #0b0f1a;
      --panel: #5b8cff;
      --safe: #9cff95;
      --break: #ff6e6e;
      --text: #e7f2ff;
      --muted: #8496b5;
    }
    * {
      box-sizing: border-box;
    }
    html {
      font-size: 16px;
      image-rendering: pixelated;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #11274c 0%, #07111a 45%, #04060a 100%);
      color: var(--text);
      font-family: 'Press Start 2P', monospace, sans-serif;
      text-rendering: optimizeLegibility;
    }
    .game-card {
      width: min(96vw, 1000px);
      background: rgba(10, 18, 34, 0.95);
      border: 6px solid #4f8cff;
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      padding: 24px;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      letter-spacing: 0.12rem;
    }
    p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.5;
    }
    .badge {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(79, 140, 255, 0.18);
      border: 2px solid rgba(79, 140, 255, 0.35);
      color: #e7f2ff;
      font-size: 0.85rem;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button {
      border: 3px solid #76c7ff;
      border-radius: 14px;
      background: #14263f;
      color: var(--text);
      font-size: 0.85rem;
      padding: 14px 18px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.08rem;
    }
    button:hover {
      transform: translateY(-1px);
      background: #1f3d6b;
    }
    .hidden-action-btn {
      width: 38px;
      height: 38px;
      margin-left: 8px;
      opacity: 0;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      pointer-events: auto;
      cursor: pointer;
    }
    .primary {
      background: #4f8cff;
      color: #011531;
      border-color: #9abfff;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      align-items: start;
    }
    .board-shell {
      padding: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 5px solid #142a55;
      border-radius: 24px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05);
    }
    .bridge {
      position: relative;
      display: grid;
      gap: 18px;
      padding: 18px 16px 22px;
      background: radial-gradient(circle at top, rgba(109, 168, 255, 0.08), rgba(9, 18, 36, 0.96) 25%, rgba(3, 6, 14, 0.98) 100%);
      border: 5px solid rgba(59, 139, 255, 0.25);
      border-radius: 28px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), inset 0 16px 40px rgba(255,255,255,0.05), 0 34px 120px rgba(0,0,0,0.65);
      background-image: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 24%), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px), repeating-linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
      background-size: auto, 14px 14px, 14px 14px, 40px 40px;
    }
    .jump-token {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #08142e;
      background: linear-gradient(135deg, #81d4ff, #4f8cff);
      border: 2px solid rgba(0,0,0,0.2);
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
      pointer-events: none;
      transform: translate(0, 0);
      transition: transform 0.44s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      z-index: 35;
    }
    .jump-token.hide {
      opacity: 0;
    }
    .character-track {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
      padding: 14px 12px;
      border: 4px dashed rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    .character-track .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12rem;
      color: rgba(255,255,255,0.75);
      margin-right: 8px;
      min-width: 70px;
    }
    .character-row {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 36px;
      padding: 8px 10px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .character-dot {
      min-width: 40px;
      min-height: 32px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08rem;
      color: #fff;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.14);
      text-shadow: 0 0 0 #07111a;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
      transition: transform 0.15s ease;
    }
    .character-dot.player {
      background: linear-gradient(135deg, #6fd4ff, #4f8cff);
      border-color: #8ac4ff;
      box-shadow: 0 0 0 2px rgba(79,140,255,0.16);
    }
    .character-dot.ai {
      background: linear-gradient(135deg, #ffbe63, #ff8f7b);
      border-color: #ffb07a;
      box-shadow: 0 0 0 2px rgba(255,158,123,0.14);
    }
    .character-dot.dead {
      opacity: 0.55;
      background: linear-gradient(135deg, #5e5e5e, #2c2c2c);
      border-color: #777;
      color: #ddd;
    }
    .character-dot.jump {
      animation: bounce 0.65s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
    .row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: transparent;
      border-radius: 28px;
      padding: 12px;
      box-shadow: inset 0 4px 25px rgba(11, 31, 63, 0.35);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .row::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: rgba(19, 33, 61, 0.35);
      pointer-events: none;
    }
    .row::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 35%, rgba(255,255,255,0.03) 100%);
      pointer-events: none;
    }
    .row-overlay {
      position: absolute;
      inset: 12px 12px auto 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .panel {
      position: relative;
      width: 100%;
      min-height: 160px;
      border: 2px solid rgba(210, 237, 255, 0.9);
      border-radius: 26px;
      background: rgba(245, 255, 255, 0.10);
      background-image: radial-gradient(circle at 10% 15%, rgba(255,255,255,0.75), rgba(255,255,255,0.12) 8%), radial-gradient(circle at 85% 20%, rgba(255,255,255,0.32), transparent 12%), linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.18) 18%, rgba(255,255,255,0.06) 35%, transparent 90%), repeating-linear-gradient(90deg, rgba(255,255,255,0.16), rgba(255,255,255,0.16) 1px, transparent 1px, transparent 5px), repeating-linear-gradient(0deg, rgba(255,255,255,0.12), rgba(255,255,255,0.12) 1px, transparent 1px, transparent 5px);
      background-blend-mode: screen, screen, screen, overlay, overlay;
      background-size: auto, auto, auto, 12px 12px, 12px 12px;
      box-shadow: inset 0 4px 0 rgba(255,255,255,0.6), inset 0 24px 90px rgba(255,255,255,0.16), 0 32px 75px rgba(0,0,0,0.58);
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }
    .panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(130deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 10%, transparent 40%, transparent 100%);
      pointer-events: none;
      opacity: 0.96;
      mix-blend-mode: screen;
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 10px;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.22), rgba(255,255,255,0.22) 1px, transparent 1px, transparent 5px), repeating-linear-gradient(-45deg, rgba(255,255,255,0.16), rgba(255,255,255,0.16) 1px, transparent 1px, transparent 5px);
      pointer-events: none;
      opacity: 0.5;
      mix-blend-mode: screen;
      border-radius: 18px;
    }
    .panel .character-layer {
      position: absolute;
      inset: 12px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }
    .character-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08rem;
      color: #111;
      background: rgba(255,255,255,0.95);
      border: 2px solid rgba(0,0,0,0.2);
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
      transform: translateY(0);
      animation: bounce 0.65s ease-in-out infinite alternate;
    }
    .character-icon.player {
      background: linear-gradient(135deg, #81d4ff, #4f8cff);
      color: #08142e;
    }
    .character-icon.ai {
      background: linear-gradient(135deg, #ffd98b, #ff9a7f);
      color: #231206;
    }
    .character-icon.dead {
      background: rgba(110,110,110,0.95);
      color: #111;
      border-color: rgba(0,0,0,0.2);
      animation: none;
    }
    .panel.safe {
      border-color: rgba(126, 255, 165, 0.95);
      background: linear-gradient(180deg, rgba(132, 234, 175, 0.25), rgba(66, 165, 125, 0.18));
      box-shadow: inset 0 4px 0 rgba(255,255,255,0.2), inset 0 24px 90px rgba(255,255,255,0.12), 0 22px 44px rgba(0,0,0,0.32);
    }
    .panel.broken {
      border-color: rgba(255, 110, 110, 0.95);
      background: linear-gradient(180deg, rgba(255, 100, 100, 0.2), rgba(78, 10, 28, 0.22));
      box-shadow: inset 0 4px 0 rgba(255,255,255,0.12), inset 0 20px 80px rgba(255,255,255,0.06), 0 18px 40px rgba(0,0,0,0.42);
    }
    .panel:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.15);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), inset 0 24px 90px rgba(255,255,255,0.18), 0 28px 64px rgba(0,0,0,0.38);
    }
    .panel.current {
      box-shadow: inset 0 8px 0 rgba(255,255,255,0.5), inset 0 34px 120px rgba(255,255,255,0.2), 0 36px 95px rgba(4, 18, 45, 0.82);
      border-color: rgba(173, 235, 255, 1);
      transform: translateY(-1px);
    }
    .panel.jumping {
      animation: jumpPanel 0.44s ease forwards;
      border-color: rgba(255, 255, 255, 1);
      box-shadow: inset 0 10px 0 rgba(255,255,255,0.55), inset 0 36px 120px rgba(255,255,255,0.25), 0 42px 110px rgba(4, 18, 45, 0.9);
    }
    @keyframes jumpPanel {
      0% { transform: translateY(0); }
      35% { transform: translateY(-14px); }
      65% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
    .panel.jumping .character-icon {
      animation: bounce 0.42s ease-in-out infinite alternate;
    }
    .panel[data-disabled="true"] {
      cursor: default;
      opacity: 0.55;
      transform: none;
    }
    .panel .pixel-icon {
      position: absolute;
      inset: 22px;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.95);
      font-size: 3rem;
      text-shadow: 0 0 0 #021526;
      z-index: 1;
      opacity: 0.9;
    }
    .panel.revealed::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.22);
      pointer-events: none;
    }
    .panel .label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 0.75rem;
      letter-spacing: 0.08rem;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }
    .status-panel {
      margin-top: 18px;
      display: grid;
      gap: 10px;
      padding: 18px;
      background: rgba(255,255,255,0.04);
      border: 4px solid rgba(255,255,255,0.08);
      border-radius: 20px;
    }
    .status-panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }
    .status-panel p {
      margin: 0;
      color: var(--text);
      font-size: 0.9rem;
    }
    .meter {
      width: 100%;
      height: 16px;
      border: 3px solid rgba(255,255,255,0.16);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
    }
    .meter span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #71d57d, #3fba7f);
    }
    .ai-list {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }
    .ai-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 12px 12px 10px;
      border: 3px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
    }
    .ai-avatar {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: #0e1c33;
      border: 3px solid rgba(79,140,255,0.35);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      color: #fff;
      text-shadow: 0 0 0 #081127;
    }
    .ai-info {
      display: grid;
      gap: 4px;
    }
    .ai-name {
      font-size: 0.75rem;
      color: #d7e3ff;
      text-transform: uppercase;
      letter-spacing: 0.08rem;
    }
    .ai-state {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .result {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(79,140,255,0.12);
      border: 2px solid rgba(79,140,255,0.24);
      color: #e7f2ff;
      font-size: 0.9rem;
      min-height: 62px;
      display: grid;
      place-content: center;
      text-align: center;
    }
    @media (max-width: 880px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .ai-avatar {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="game-card">
    <div style="position: absolute; top: 12px; right: 12px; z-index: 10;">
      <button onclick="window.location.href='index.html'" style="background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;">Inicio</button>
    </div>
    <div class="header">
      <div>
        <h1>Puento de Cristales</h1>
        <p>Escoge bien el cristal seguro para cruzar. Otros personajes controlados por IA también avanzan sobre los cristales. ¡No te caigas!</p>
      </div>
      <div class="badge" id="stepBadge">Ronda 1 / 6</div>
    </div>

    <div class="actions">
      <button class="primary" id="newGameBtn">Reiniciar juego</button>
      <button id="showPathBtn" class="hidden-action-btn">Mostrar camino</button>
    </div>

    <div class="layout">
      <section class="board-shell">
        <div class="character-track" id="characterTrack"></div>
        <div class="character-stage" id="characterStage"></div>
        <div class="bridge" id="bridge"></div>
        <div class="status-panel">
          <h2>Estado</h2>
          <p id="statusText">Haz clic en el cristal correcto para avanzar.</p>
          <div class="meter"><span id="progressBar" style="width:0%"></span></div>
        </div>
      </section>

      <aside>
        <div class="status-panel">
          <h2>Personajes IA</h2>
          <div class="ai-list" id="aiList"></div>
        </div>
        <div class="result" id="resultText">Primer objetivo: cruzar los 6 paneles.</div>
      </aside>
    </div>
  </div>

  <script>
    const ROWS = 6;
    const aiPlayers = [
      { name: 'Ji-hoon', avatar: 'JH', pos: 0, col: null, alive: true, status: 'Concentrado', skill: 0.68 },
      { name: 'Sang-mi', avatar: 'SM', pos: 0, col: null, alive: true, status: 'Tímida', skill: 0.78 },
      { name: 'Min-seo', avatar: 'MS', pos: 0, col: null, alive: true, status: 'Acelerada', skill: 0.54 },
      { name: 'Dong-wook', avatar: 'DW', pos: 0, col: null, alive: true, status: 'Firme', skill: 0.72 }
    ];
    let safePath = [];
    let round = 0;
    let playerCol = null;
    let jumpingPanel = null;
    let jumpToken = null;
    let gameOver = false;
    const bridgeEl = document.getElementById('bridge');
    const statusText = document.getElementById('statusText');
    const resultText = document.getElementById('resultText');
    const stepBadge = document.getElementById('stepBadge');
    const progressBar = document.getElementById('progressBar');
    const aiList = document.getElementById('aiList');
    const characterStage = document.getElementById('characterStage');
    const newGameBtn = document.getElementById('newGameBtn');
    const showPathBtn = document.getElementById('showPathBtn');

    function createSafePath() {
      safePath = Array.from({ length: ROWS }, () => Math.random() < 0.5 ? 0 : 1);
    }

    function resetGame() {
      round = 0;
      playerCol = null;
      jumpingPanel = null;
      gameOver = false;
      createSafePath();
      aiPlayers.forEach(ai => {
        ai.pos = 0;
        ai.col = null;
        ai.alive = true;
        ai.status = 'Preparado';
      });
      resultText.textContent = 'Primer objetivo: cruzar los 6 paneles.';
      statusText.textContent = 'Haz clic en el cristal correcto para avanzar.';
      updateBadge();
      buildBridge();
      renderAI();
      renderCharacters();
      renderStage();
      updateProgress();
      showPathBtn.textContent = 'Mostrar camino';
      showPathBtn.dataset.visible = 'false';
    }

    function updateBadge() {
      stepBadge.textContent = `Ronda ${round + 1} / ${ROWS}`;
    }

    function buildBridge() {
      bridgeEl.innerHTML = '';
      for (let row = 0; row < ROWS; row++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        for (let col = 0; col < 2; col++) {
          const panel = document.createElement('button');
          panel.className = 'panel';
          panel.dataset.row = row;
          panel.dataset.col = col;
          panel.dataset.disabled = row !== round || gameOver;
          panel.disabled = row !== round || gameOver;
          panel.innerHTML = `<div class="pixel-icon">⧉</div><span class="label">Cristal ${col === 0 ? 'Izq' : 'Der'}</span>`;

          if (row < round || showPathBtn.dataset.visible === 'true' || gameOver) {
            panel.classList.add('revealed');
            panel.classList.add(col === safePath[row] ? 'safe' : 'broken');
            panel.innerHTML = `<div class="pixel-icon">${col === safePath[row] ? '✓' : '✕'}</div><span class="label">${col === safePath[row] ? 'Seguro' : 'Roto'}</span>`;
          }

          appendCharacterOnPanel(panel, row, col);
          if (row === round && !gameOver) {
            panel.classList.add('current');
          }
          if (jumpingPanel && jumpingPanel.row === row && jumpingPanel.col === col) {
            panel.classList.add('jumping');
          }
          panel.addEventListener('click', () => choosePanel(row, col));
          rowEl.appendChild(panel);
        }
        bridgeEl.appendChild(rowEl);
      }
    }

    function appendCharacterOnPanel(panel, row, col) {
      const layer = document.createElement('div');
      layer.className = 'character-layer';
      let hasCharacter = false;

      if (playerCol !== null && row === round - 1 && col === playerCol) {
        const playerIcon = document.createElement('span');
        playerIcon.className = 'character-icon player';
        playerIcon.textContent = 'T';
        playerIcon.title = 'Jugador';
        layer.appendChild(playerIcon);
        hasCharacter = true;
      }

      aiPlayers.forEach(ai => {
        if (ai.col === col && ((ai.alive && row === ai.pos - 1) || (!ai.alive && row === ai.pos))) {
          const aiIcon = document.createElement('span');
          aiIcon.className = `character-icon ai${ai.alive ? '' : ' dead'}`;
          aiIcon.textContent = ai.alive ? ai.avatar : 'X';
          aiIcon.title = `${ai.name} • ${ai.status}`;
          layer.appendChild(aiIcon);
          hasCharacter = true;
        }
      });

      if (hasCharacter) {
        panel.appendChild(layer);
      }
    }

    function renderAI() {
      aiList.innerHTML = aiPlayers.map(ai => {
        const aliveText = ai.alive ? 'Vivo' : 'Caído';
        return `
          <div class="ai-item">
            <div class="ai-avatar">${ai.avatar}</div>
            <div class="ai-info">
              <div class="ai-name">${ai.name}</div>
              <div class="ai-state">${aliveText} • Panel ${Math.min(ai.pos + 1, ROWS)} / ${ROWS}</div>
              <div class="ai-state">${ai.status}</div>
            </div>
          </div>`;
      }).join('');
    }

    function renderCharacters() {
      const track = document.getElementById('characterTrack');
      track.innerHTML = '';
      for (let row = 0; row < ROWS; row++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'character-row';

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = `Panel ${row + 1}`;
        rowEl.appendChild(label);

        if (round === row && !gameOver) {
          const playerDot = document.createElement('span');
          playerDot.className = 'character-dot player jump';
          playerDot.textContent = 'TÚ';
          playerDot.title = 'Tú - Jugador';
          rowEl.appendChild(playerDot);
        }

        aiPlayers.forEach(ai => {
          if (ai.pos === row) {
            const aiDot = document.createElement('span');
            aiDot.className = `character-dot ai${ai.alive ? ' jump' : ' dead'}`;
            aiDot.textContent = ai.alive ? ai.avatar : 'X';
            aiDot.title = `${ai.name} • ${ai.status}`;
            rowEl.appendChild(aiDot);
          }
        });

        track.appendChild(rowEl);
      }
    }

    function createCard(name, role, pos, status, alive, isPlayer = false) {
      const card = document.createElement('div');
      card.className = 'character-card';
      const type = document.createElement('span');
      type.className = 'name';
      type.textContent = role;
      const sprite = document.createElement('div');
      const spriteType = !alive ? 'dead' : isPlayer ? 'player' : 'ai';
      const jumpClass = !alive ? '' : ' jump';
      sprite.className = `character-sprite ${spriteType}${jumpClass}`;
      sprite.textContent = name;
      const info = document.createElement('span');
      info.className = 'position';
      info.textContent = alive ? `Panel ${Math.min(pos + 1, ROWS)} / ${ROWS}` : status;
      card.append(type, sprite, info);
      return card;
    }

    function renderStage() {
      characterStage.innerHTML = '';
      characterStage.appendChild(createCard('TÚ', 'Jugador', round, 'Saltando', !gameOver, true));
      aiPlayers.forEach(ai => {
        characterStage.appendChild(createCard(ai.alive ? ai.avatar : 'X', ai.name, ai.pos, ai.status, ai.alive, false));
      });
    }

    function getPanelCenter(row, col) {
      const panel = bridgeEl.querySelector(`.panel[data-row="${row}"][data-col="${col}"]`);
      if (!panel) return null;
      const rect = panel.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function animatePlayerJump(start, end, onComplete) {
      const endPanel = bridgeEl.querySelector(`.panel[data-row="${end.row}"][data-col="${end.col}"]`);
      if (!endPanel) {
        onComplete();
        return;
      }

      const endRect = endPanel.getBoundingClientRect();
      const bodyRect = document.body.getBoundingClientRect();
      const endX = endRect.left - bodyRect.left + endRect.width / 2 - 18;
      const endY = endRect.top - bodyRect.top + endRect.height / 2 - 18;

      let startX = endX;
      let startY = endY - 56;
      if (start && start.row >= 0) {
        const startPanel = bridgeEl.querySelector(`.panel[data-row="${start.row}"][data-col="${start.col}"]`);
        if (startPanel) {
          const startRect = startPanel.getBoundingClientRect();
          startX = startRect.left - bodyRect.left + startRect.width / 2 - 18;
          startY = startRect.top - bodyRect.top + startRect.height / 2 - 18;
        }
      }

      if (!jumpToken) {
        jumpToken = document.createElement('span');
        jumpToken.className = 'jump-token';
        jumpToken.textContent = 'T';
        document.body.appendChild(jumpToken);
      }
      jumpToken.style.left = `${startX}px`;
      jumpToken.style.top = `${startY}px`;
      jumpToken.style.transform = 'translate(0, 0)';
      jumpToken.classList.remove('hide');

      requestAnimationFrame(() => {
        const dx = endX - startX;
        const dy = endY - startY;
        jumpToken.style.transform = `translate(${dx}px, ${dy}px)`;
      });

      setTimeout(() => {
        jumpToken.classList.add('hide');
        setTimeout(() => {
          if (jumpToken) {
            jumpToken.remove();
            jumpToken = null;
          }
        }, 220);
        onComplete();
      }, 460);
    }

    function choosePanel(row, col) {
      if (gameOver || row !== round) return;
      const safe = safePath[row];
      const previousCol = playerCol;
      playerCol = col;
      jumpingPanel = { row, col };
      const previousPosition = { row: round - 1, col: previousCol };
      const targetPosition = { row, col };
      const continueAfterJump = () => {
        if (col === safe) {
          statusText.textContent = '¡Correcto! Avanzas al siguiente cristal.';
          revealRow(row);
          round++;
          renderCharacters();
          renderStage();
          if (round >= ROWS) {
            gameOver = true;
            resultText.textContent = '¡Has cruzado el puente! Victoria pixelada.';
            updateProgress();
            buildBridge();
            alert('Felicidades has ganado');
            return;
          }
          updateBadge();
          updateProgress();
          advanceAIs();
          buildBridge();
        } else {
          gameOver = true;
          revealRow(row, col);
          statusText.textContent = 'Has elegido mal. El cristal se rompe y caes.';
          resultText.textContent = 'Game Over. Reinicia para intentarlo otra vez.';
          renderCharacters();
          renderStage();
          buildBridge();
        }
        jumpingPanel = null;
      };

      animatePlayerJump(previousPosition, targetPosition, continueAfterJump);
    }

    function revealRow(row, chosenCol = null) {
      const rowButtons = bridgeEl.querySelectorAll(`.row:nth-child(${row + 1}) .panel`);
      rowButtons.forEach(button => {
        const col = Number(button.dataset.col);
        const safe = safePath[row];
        button.classList.add('revealed');
        button.classList.toggle('safe', col === safe);
        button.classList.toggle('broken', col !== safe);
        button.innerHTML = `<div class="pixel-icon">${col === safe ? '✓' : '✕'}</div><span class="label">${col === safe ? 'Seguro' : 'Roto'}</span>`;

        if (chosenCol !== null && col === chosenCol && col !== safe) {
          button.style.borderColor = '#ff3333';
        }
      });
    }

    function chooseAIChoice(ai) {
      if (!ai.alive || ai.pos >= ROWS) return null;
      const safe = safePath[ai.pos];
      const chance = Math.random();
      return chance < ai.skill ? safe : safe === 0 ? 1 : 0;
    }

    function advanceAIs() {
      aiPlayers.forEach(ai => {
        if (!ai.alive || ai.pos >= ROWS) return;
        const choice = chooseAIChoice(ai);
        ai.col = choice;
        const safe = safePath[ai.pos];
        if (choice === safe) {
          ai.pos += 1;
          ai.status = ai.pos >= ROWS ? 'Cruzó' : 'Avanza';
        } else {
          ai.alive = false;
          ai.status = 'Se cayó';
        }
      });
      renderAI();
      renderCharacters();
      renderStage();
      const aliveCount = aiPlayers.filter(ai => ai.alive).length;
      if (aliveCount === 0 && !gameOver) {
        resultText.textContent = 'Todos los personajes IA cayeron, pero aún puedes seguir.';
      }
    }

    function updateProgress() {
      const percent = Math.round((round / ROWS) * 100);
      progressBar.style.width = `${percent}%`;
    }

    function toggleShowPath() {
      const visible = showPathBtn.dataset.visible === 'true';
      showPathBtn.dataset.visible = visible ? 'false' : 'true';
      showPathBtn.textContent = visible ? 'Mostrar camino' : 'Ocultar camino';
      buildBridge();
    }

    newGameBtn.addEventListener('click', resetGame);
    showPathBtn.addEventListener('click', toggleShowPath);
    resetGame();
  </script>

  <script src="bonus.js"></script>
</body>
</html>
