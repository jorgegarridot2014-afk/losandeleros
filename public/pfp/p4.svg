<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="50" fill="#10b981"/>
  
  <!-- Cabeza redonda -->
  <circle cx="50" cy="35" r="18" fill="#34d399"/>
  
  <!-- Orejas -->
  <circle cx="32" cy="30" r="6" fill="#34d399"/>
  <circle cx="68" cy="30" r="6" fill="#34d399"/>
  <circle cx="32" cy="30" r="3" fill="#d1fae5"/>
  <circle cx="68" cy="30" r="3" fill="#d1fae5"/>
  
  <!-- Ojos felices -->
  <ellipse cx="43" cy="32" rx="2.5" ry="3.5" fill="#000"/>
  <ellipse cx="57" cy="32" rx="2.5" ry="3.5" fill="#000"/>
  
  <!-- Cejas arquedas -->
  <path d="M 39 27 Q 43 25 47 27" stroke="#000" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 53 27 Q 57 25 61 27" stroke="#000" stroke-width="1" fill="none" stroke-linecap="round"/>
  
  <!-- Nariz -->
  <polygon points="50,33 47,36 53,36" fill="#f97316"/>
  
  <!-- Gran sonrisa -->
  <path d="M 42 39 Q 50 43 58 39" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 42 39 Q 50 42 58 39" fill="#fda92d" opacity="0.3"/>
  
  <!-- Cuerpo feliz -->
  <rect x="34" y="53" width="32" height="28" rx="8" fill="#6ee7b7"/>
  
  <!-- Botones en pecho -->
  <circle cx="42" cy="65" r="2" fill="#059669"/>
  <circle cx="50" cy="65" r="2" fill="#059669"/>
  <circle cx="58" cy="65" r="2" fill="#059669"/>
  
  <!-- Brazos levantados -->
  <ellipse cx="20" cy="55" rx="7" ry="14" fill="#34d399" transform="rotate(-40 20 55)"/>
  <ellipse cx="80" cy="55" rx="7" ry="14" fill="#34d399" transform="rotate(40 80 55)"/>
  
  <!-- Manitas -->
  <circle cx="12" cy="45" r="4" fill="#34d399"/>
  <circle cx="88" cy="45" r="4" fill="#34d399"/>
</svg>