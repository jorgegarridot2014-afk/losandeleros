<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body {
  margin: 0;
  font-family: 'Courier New', monospace;
  background: linear-gradient(135deg, #000000 0%, #000000 100%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  text-align: center;
  background: rgba(255,255,255,0.03);
  border: 1px solid #00ffff33;
  border-radius: 20px;
  padding: 40px 30px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(0,255,255,0.1);
}

.glow {
  font-size: 32px;
  color: #00ffff;
  text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff55;
  margin-bottom: 30px;
  letter-spacing: 2px;
}

.subtitle {
  color: #888;
  font-size: 14px;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  grid-gap: 12px;
  margin: 25px auto;
  width: max-content;
}

.key {
  background: #111;
  border: 2px solid #00ffff55;
  border-radius: 12px;
  padding: 18px;
  font-size: 22px;
  color: #00ffff;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: bold;
}

.key:hover {
  background: #00ffff;
  color: #000;
  box-shadow: 0 0 15px #00ffff;
}

.key:active {
  transform: scale(0.92);
}

.key.del {
  border-color: #ff660055;
  color: #ff6600;
}

.key.del:hover {
  background: #ff6600;
  color: #000;
  box-shadow: 0 0 15px #ff6600;
}

.key.enter {
  border-color: #00ff9955;
  color: #00ff99;
  grid-column: span 2;
}

.key.enter:hover {
  background: #00ff99;
  color: #000;
  box-shadow: 0 0 15px #00ff99;
}

#displayCode {
  font-size: 28px;
  letter-spacing: 15px;
  margin: 20px 0 25px;
  color: #00ffff;
  font-family: monospace;
  text-shadow: 0 0 8px #00ffff55;
}

#messageInput {
  width: 90%;
  max-width: 380px;
  padding: 14px 18px;
  font-size: 16px;
  border: 2px solid #00ffff55;
  border-radius: 12px;
  background: #050505;
  color: #00ffff;
  margin: 15px 0;
  display: none;
  font-family: 'Courier New', monospace;
}

#messageInput::placeholder {
  color: #444;
}

#sendMessage {
  display: none;
  background: #00ff99;
  color: #000;
  border: none;
  padding: 12px 30px;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  margin: 15px 0;
}

#sendMessage:hover {
  background: #00dd88;
  box-shadow: 0 0 15px #00ff99;
}

.status {
  font-size: 12px;
  color: #00ff99;
  margin-top: 15px;
  opacity: 0;
  transition: opacity 0.3s;
}

.status.connected {
  opacity: 1;
}
  #stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
  #stars::before,#stars::after { content:""; position:absolute; top:0; left:0; width:100%; height:100%; background-repeat:repeat; background-size:200px 200px; animation:twinkle 5s ease-in-out infinite, starsMove 80s linear infinite; }
  #stars::before { background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 40px 70px,#ffe,transparent),radial-gradient(1.5px 1.5px at 50px 160px,#fff,transparent),radial-gradient(1px 1px at 90px 40px,#ffe,transparent),radial-gradient(1px 1px at 130px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 120px,#ffe,transparent); animation-delay:0s,0s; }
  #stars::after { background-image:radial-gradient(1px 1px at 10px 50px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 10px,#ffe,transparent),radial-gradient(1px 1px at 100px 90px,#fff,transparent),radial-gradient(1px 1px at 150px 150px,#ffe,transparent),radial-gradient(1.5px 1.5px at 180px 60px,#fff,transparent); animation-delay:2.5s,0s; background-size:250px 250px; }
  @keyframes twinkle { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
  @keyframes starsMove { 0%{background-position:0 0;} 25%{background-position:500px -300px;} 50%{background-position:-300px 400px;} 75%{background-position:600px 200px;} 100%{background-position:0 0;} }
</style>

</head>

<body>
<div id="stars"></div>
<div class="box">

  <h1 class="glow">🛠 PANEL ADMIN</h1>
  <p class="subtitle">> Acceso restringido - Identificación requerida</p>
  
  <div id="authSection">
    <p style="color:#aaa; font-size:13px; margin-bottom:10px;">INTRODUCE CLAVE DE ACCESO:</p>
    <div id="displayCode">_____</div>
    <div class="keypad">
      <div class="key" onclick="addDigit('1')">1</div>
      <div class="key" onclick="addDigit('2')">2</div>
      <div class="key" onclick="addDigit('3')">3</div>
      <div class="key" onclick="addDigit('4')">4</div>
      <div class="key" onclick="addDigit('5')">5</div>
      <div class="key" onclick="addDigit('6')">6</div>
      <div class="key" onclick="addDigit('7')">7</div>
      <div class="key" onclick="addDigit('8')">8</div>
      <div class="key" onclick="addDigit('9')">9</div>
      <div class="key del" onclick="clearCode()">⌫</div>
      <div class="key enter" onclick="checkCode()">INTRO</div>
    </div>
  </div>

  <div id="messageSection" style="display:none;">
    <p style="color:#00ff99; margin-bottom:15px;">✓ Acceso concedido - Mensaje en tiempo real</p>
    <input id="messageInput" type="text" placeholder="Escribe mensaje para todos los usuarios...">
    <br>
    <button id="sendMessage" onclick="sendBroadcast()">ENVIAR MENSAJE</button>
    <br><br>
    <button id="hackerMode" onclick="activarModoHacker()" style="background:#111; color:#ff0033; border:2px solid #ff0033; padding:12px 20px; font-size:16px; border-radius:10px; cursor:pointer; font-weight:bold; box-shadow:0 0 15px #ff003355; letter-spacing:1px;">MODO HACKER</button>
    <br><br>
    <button id="btnMantenimiento" onclick="toggleMantenimiento()" style="background:#111; color:#ff9900; border:2px solid #ff9900; padding:12px 20px; font-size:16px; border-radius:10px; cursor:pointer; font-weight:bold; box-shadow:0 0 15px #ff990055; letter-spacing:1px;">🔧 MANTENIMIENTO: OFF</button>
    <br><br>
    <button id="btnRestriccionIA" onclick="toggleRestriccionIA()" style="background:#111; color:#ff6600; border:2px solid #ff6600; padding:12px 20px; font-size:16px; border-radius:10px; cursor:pointer; font-weight:bold; box-shadow:0 0 15px #ff660055; letter-spacing:1px;">RESTRINGIR IA: OFF</button>
    <br><br>
    <button id="btnPuntos40" onclick="otorgarPuntos40()" style="background:#111; color:#00ff99; border:2px solid #00ff99; padding:12px 20px; font-size:16px; border-radius:10px; cursor:pointer; font-weight:bold; box-shadow:0 0 15px #00ff9955; letter-spacing:1px;">💰 OTORGAR +40% PUNTOS</button>
    <br><br>
    <button id="btnBanear" onclick="mostrarCuentasABanear()" style="background:#111; color:#ff0033; border:2px solid #ff0033; padding:12px 20px; font-size:16px; border-radius:10px; cursor:pointer; font-weight:bold; box-shadow:0 0 15px #ff003355; letter-spacing:1px;">🚫 BANEAR</button>

    <br><br>
    <button onclick="volver()" style="background:#333; color:#aaa;">VOLVER</button>
    <div id="status" class="status">Conectado</div>
  </div>

  <div id="banearSection" style="display:none; max-height:500px; overflow-y:auto;">
    <h3 style="color:#ff0033; margin-bottom:15px; letter-spacing:2px;">CUENTAS DE LOS ANDELEROS</h3>
    <div id="cuentasList" style="display:flex; flex-direction:column; gap:10px;"></div>
    <br>
    <button onclick="ocultarCuentasABanear()" style="background:#333; color:#aaa; margin-top:15px;">VOLVER</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let enteredCode = "";
const CORRECT_CODE = "678931";

function addDigit(d) {
  if (enteredCode.length < 6) {
    enteredCode += d;
    updateDisplay();
  }
}

function clearCode() {
  enteredCode = "";
  updateDisplay();
}

function updateDisplay() {
  const display = document.getElementById("displayCode");
  let shown = "";
  for (let i = 0; i < 6; i++) {
    shown += i < enteredCode.length ? enteredCode[i] : "_";
  }
  display.innerText = shown;
}

function checkCode() {
  if (enteredCode === CORRECT_CODE) {
    document.getElementById("authSection").style.display = "none";
    document.getElementById("messageSection").style.display = "block";
    document.getElementById("messageInput").style.display = "block";
    document.getElementById("sendMessage").style.display = "inline-block";
    document.getElementById("messageInput").focus();
    
    const status = document.getElementById("status");
    status.classList.add("connected");
  } else {
    enteredCode = "";
    updateDisplay();
  }
}

const socket = io();

socket.emit("auth-admin");

socket.on("connect", () => {
  console.log("✅ Conectado al servidor Socket.IO");
});

socket.on("connect_error", (err) => {
  console.error("❌ Error conexión Socket.IO:", err);
});

function sendBroadcast() {
  const msg = document.getElementById("messageInput").value.trim();
  if (msg) {
    console.log("📤 Enviando mensaje:", msg);
    socket.emit("admin-message", { user: "admin", message: msg });
    document.getElementById("messageInput").value = "";
  }
}

function activarModoHacker() {
  if (!confirm("¿Seguro que quieres activar el modo hacker para todos los usuarios conectados?")) return;
  socket.emit("admin-hackermode");
}

let mantenimientoActivoLocal = false;
socket.on("mantenimiento", (data) => {
  mantenimientoActivoLocal = data.activo;
  const btn = document.getElementById("btnMantenimiento");
  if (btn) {
    btn.textContent = "🔧 MANTENIMIENTO: " + (mantenimientoActivoLocal ? "ON" : "OFF");
    btn.style.background = mantenimientoActivoLocal ? "#ff9900" : "#111";
    btn.style.color = mantenimientoActivoLocal ? "#fff" : "#ff9900";
    btn.style.borderColor = mantenimientoActivoLocal ? "#ff9900" : "#ff9900";
    btn.style.boxShadow = mantenimientoActivoLocal ? "0 0 20px #ff9900" : "0 0 15px #ff990055";
  }
});

function toggleMantenimiento() {
  socket.emit("admin-mantenimiento");
}

let iaRestringidaLocal = false;
socket.on("ia-restringida", (data) => {
  iaRestringidaLocal = data.activa;
  const btn = document.getElementById("btnRestriccionIA");
  if (btn) {
    btn.textContent = "RESTRINGIR IA: " + (iaRestringidaLocal ? "ON" : "OFF");
    btn.style.background = iaRestringidaLocal ? "#ff6600" : "#111";
    btn.style.color = iaRestringidaLocal ? "#fff" : "#ff6600";
    btn.style.boxShadow = iaRestringidaLocal ? "0 0 20px #ff6600" : "0 0 15px #ff660055";
  }
});

function toggleRestriccionIA() {
  socket.emit("admin-restringir-ia");
}

function otorgarPuntos40() {
  if (!confirm("¿Otorgar +40% de puntos a TODAS las cuentas?")) return;
  socket.emit("admin-puntos-40");
  console.log("📊 Solicitando +40% puntos a todas las cuentas");
}

document.getElementById("messageInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    sendBroadcast();
  }
});

socket.on("cuenta-baneada", (data) => {
  console.log("👮 Cuenta baneada/desbaneada en tiempo real:", data);
});

socket.on("admin-puntos-40-ok", (data) => {
  alert("✅ +40% puntos otorgados a " + data.count + " cuentas");
});
socket.on("admin-puntos-40-error", (data) => {
  alert("❌ Error: " + (data.error || "no se pudieron otorgar los puntos"));
});

async function mostrarCuentasABanear(){
  document.getElementById("messageSection").style.display = "none";
  document.getElementById("banearSection").style.display = "block";
  const list = document.getElementById("cuentasList");
  list.innerHTML = "<p style='color:#888; font-size:13px;'>Cargando cuentas...</p>";
  try {
    const res = await fetch("/cuentas");
    const cuentas = await res.json();
    list.innerHTML = "";
    if(!cuentas || cuentas.length === 0){
      list.innerHTML = "<p style='color:#888; font-size:13px;'>No hay cuentas registradas.</p>";
      return;
    }
    cuentas.forEach(acc => {
      const div = document.createElement("div");
      const baneada = acc.baneada === true;
      div.style.cssText = "background:rgba(255,255,255,0.05); border:1px solid " + (baneada ? "#ff003355" : "#00ffff55") + "; border-radius:10px; padding:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;";
      div.innerHTML = "<div style='flex:1;'><div style='font-weight:bold; color:" + (baneada ? "#ff0033" : "#00ffff") + "; font-size:14px;'>" + acc.apodo + "</div><div style='font-size:11px; color:#666; opacity:0.7;'>ID: " + acc.ide + "</div></div>";
      const btn = document.createElement("button");
      btn.style.cssText = "background:" + (baneada ? "#ff0033" : "#111") + "; color:#fff; border:2px solid " + (baneada ? "#ff0033" : "#00ffff55") + "; padding:8px 14px; font-size:13px; border-radius:8px; cursor:pointer; font-weight:bold; white-space:nowrap;";
      btn.textContent = baneada ? "🔓 Desbanear" : "🚫 Banear";
      btn.onclick = () => toggleBan(acc.ide, acc.apodo, !baneada);
      div.appendChild(btn);
      list.appendChild(div);
    });
  } catch(e){
    list.innerHTML = "<p style='color:#ff0033;'>Error cargando cuentas.</p>";
    console.error("Error cargando cuentas:", e);
  }
}

function ocultarCuentasABanear(){
  document.getElementById("banearSection").style.display = "none";
  document.getElementById("messageSection").style.display = "block";
}

async function toggleBan(ide, apodo, banear){
  const accion = banear ? "banear" : "desbanear";
  if(!confirm(`¿${banear ? "Banear" : "Desbanear"} a "${apodo}" (${ide})?`)) return;
  try {
    const res = await fetch(`/ban/${encodeURIComponent(ide)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ baneada: banear })
    });
    const data = await res.json();
    if(res.ok && data.ok){
      alert(`${banear ? "✅ Cuenta baneada" : "✅ Cuenta desbaneada"}: ${apodo} (${ide})`);
      mostrarCuentasABanear();
    } else {
      alert("❌ Error: " + (data.error || "no se pudo completar la acción"));
    }
  } catch(e){
    alert("❌ Error de conexión");
    console.error("Error toggle ban:", e);
  }
}

function volver(){
  window.location.href = "index.html";
}

</script>

</body>
</html>
