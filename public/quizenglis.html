<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Quiz Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08080f;
      --surface: #10101a;
      --card: #16162200;
      --card-solid: #161622;
      --border: #22223a;
      --accent: #8b5cf6;
      --accent2: #ec4899;
      --accent-glow: rgba(139,92,246,0.25);
      --gold: #f59e0b;
      --text: #f1f0ff;
      --muted: #6b6b90;
      --green: #34d399;
      --red: #f87171;
      --radius: 18px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── USER BADGE ── */
    #user-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(16,16,26,0.85);
      backdrop-filter: blur(12px);
      padding: 6px 16px;
      border-radius: 25px;
      border: 1px solid var(--border);
      z-index: 40;
    }
    #user-badge img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      object-fit: cover;
    }
    #user-badge .user-info {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    #user-badge .user-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }
    #user-badge .user-points {
      font-size: 10px;
      color: var(--gold);
      font-weight: 600;
    }

    /* ── BACK BAR ── */
    .back-bar {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(16,16,26,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 18px;
      height: auto;
      display: flex;
      align-items: center;
      z-index: 50;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 10px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.3);
      color: #c4b5fd;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.18s;
      letter-spacing: 0.2px;
    }
    .btn-back:hover {
      background: rgba(139,92,246,0.2);
      border-color: rgba(139,92,246,0.6);
      color: #fff;
      transform: translateX(-2px);
    }
    .btn-back svg { transition: transform 0.18s; }
    .btn-back:hover svg { transform: translateX(-2px); }

    /* ── HERO ── */
    .hero {
      width: 100%;
      text-align: center;
      padding: 56px 24px 44px;
      position: relative;
      overflow: hidden;
    }
    .hero-glow {
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 350px;
      background: radial-gradient(ellipse, rgba(139,92,246,0.15) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a78bfa;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 100px;
      padding: 6px 18px;
      margin-bottom: 22px;
    }
    .hero-label::before { content: '✦'; font-size: 9px; }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.2rem, 7vw, 3.8rem);
      font-weight: 800;
      line-height: 1.08;
      background: linear-gradient(135deg, #fff 20%, #a78bfa 60%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }
    .hero p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 380px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ── PROGRESS ── */
    .progress-wrap {
      width: 100%;
      max-width: 660px;
      padding: 0 24px;
      margin-bottom: 4px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-meta span { font-size: 12.5px; color: var(--muted); }
    .progress-meta strong { font-family: 'Syne', sans-serif; font-size: 14px; color: var(--text); }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
      width: 0%;
      box-shadow: 0 0 10px rgba(139,92,246,0.5);
    }

    /* ── STAGE ── */
    .stage {
      width: 100%;
      max-width: 660px;
      padding: 28px 24px 64px;
    }

    /* ── CARD ── */
    .question-card {
      background: linear-gradient(145deg, #1c1c2e, #141424);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(139,92,246,0.05);
      animation: cardIn 0.38s cubic-bezier(.4,0,.2,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateX(36px) scale(0.98); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    .card-exit {
      animation: cardOut 0.28s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes cardOut {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to   { opacity: 0; transform: translateX(-36px) scale(0.98); }
    }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .q-num {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      color: #a78bfa;
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .q-badge {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 12px; border-radius: 100px;
    }
    .badge-mc { background: rgba(52,211,153,0.1); color: var(--green); border: 1px solid rgba(52,211,153,0.22); }
    .badge-tf { background: rgba(245,158,11,0.1); color: var(--gold); border: 1px solid rgba(245,158,11,0.22); }

    .q-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 26px;
      letter-spacing: -0.1px;
    }

    /* ── OPTIONS ── */
    .options { display: flex; flex-direction: column; gap: 11px; }
    .option {
      display: flex; align-items: center; gap: 14px;
      padding: 15px 18px;
      border-radius: 13px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .option::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(139,92,246,0.06), transparent);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .option:hover:not(.locked)::before { opacity: 1; }
    .option:hover:not(.locked) { border-color: rgba(139,92,246,0.5); }
    .option.locked { cursor: default; }

    .opt-letter {
      width: 32px; height: 32px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      transition: all 0.15s;
      position: relative; z-index: 1;
    }
    .option:hover:not(.locked) .opt-letter { border-color: var(--accent); color: var(--accent); }
    .opt-text { font-size: 0.92rem; line-height: 1.45; position: relative; z-index: 1; }

    .option.selected { border-color: var(--accent); background: rgba(139,92,246,0.08); }
    .option.selected .opt-letter { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(139,92,246,0.5); }
    .option.correct { border-color: var(--green); background: rgba(52,211,153,0.07); }
    .option.correct .opt-letter { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 0 12px rgba(52,211,153,0.4); }
    .option.wrong { border-color: var(--red); background: rgba(248,113,113,0.06); }
    .option.wrong .opt-letter { background: var(--red); border-color: var(--red); color: #fff; }

    /* ── TF ── */
    .tf-options { display: flex; gap: 14px; }
    .tf-btn {
      flex: 1; padding: 18px 16px;
      border-radius: 13px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      font-family: 'Syne', sans-serif;
    }
    .tf-btn:hover:not(.locked) { border-color: rgba(139,92,246,0.5); color: var(--text); background: rgba(139,92,246,0.07); }
    .tf-btn.locked { cursor: default; }
    .tf-btn.selected { border-color: var(--accent); background: rgba(139,92,246,0.1); color: var(--accent); }
    .tf-btn.correct { border-color: var(--green); background: rgba(52,211,153,0.08); color: var(--green); box-shadow: 0 0 16px rgba(52,211,153,0.15); }
    .tf-btn.wrong { border-color: var(--red); background: rgba(248,113,113,0.06); color: var(--red); }

    /* ── FEEDBACK ── */
    .feedback {
      margin-top: 18px;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.55;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.22s, transform 0.22s;
    }
    .feedback.show { opacity: 1; transform: translateY(0); }
    .feedback.correct-fb { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.22); color: #6ee7b7; }
    .feedback.wrong-fb { background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.2); color: #fca5a5; }

    /* ── NAV ── */
    .nav-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 26px;
    }
    .btn-next {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      padding: 14px 34px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 24px rgba(139,92,246,0.35);
      display: none;
      letter-spacing: 0.2px;
    }
    .btn-next:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(139,92,246,0.45); }
    .btn-next.visible { display: inline-block; }

    /* ── RESULTS ── */
    .results {
      display: none;
      width: 100%;
      max-width: 580px;
      padding: 20px 24px 80px;
      text-align: center;
    }
    .results.show { display: block; }
    .results-card {
      background: linear-gradient(145deg, #1c1c2e, #141424);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 52px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      animation: cardIn 0.4s cubic-bezier(.4,0,.2,1);
    }

    .score-ring-wrap {
      position: relative;
      width: 160px; height: 160px;
      margin: 0 auto 32px;
    }
    .score-ring-svg { transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
    .ring-fill {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 439.8;
      stroke-dashoffset: 439.8;
      transition: stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);
    }
    .score-inner {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .score-pct {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem; font-weight: 800;
      line-height: 1;
    }
    .score-label { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

    .results h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.9rem; font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    .results > .results-card > p { color: var(--muted); margin-bottom: 36px; line-height: 1.7; font-size: 0.93rem; }

    .r-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 36px;
    }
    .r-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 12px;
    }
    .r-box .rv { font-family: 'Syne', sans-serif; font-size: 1.75rem; font-weight: 800; line-height: 1; }
    .r-box .rl { font-size: 10px; color: var(--muted); margin-top: 5px; letter-spacing: 1.5px; text-transform: uppercase; }
    .r-box.g .rv { color: var(--green); }
    .r-box.r .rv { color: var(--red); }
    .r-box.y .rv { color: var(--gold); }

    .btn-retry {
      background: transparent;
      color: #a78bfa;
      border: 1.5px solid rgba(139,92,246,0.4);
      padding: 14px 44px;
      border-radius: 13px;
      font-size: 0.95rem; font-weight: 700;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.2px;
    }
    .btn-retry:hover { background: rgba(139,92,246,0.1); border-color: var(--accent); color: #fff; }

    @media (max-width: 500px) {
      .r-grid { grid-template-columns: 1fr 1fr; }
      .hero h1 { font-size: 2rem; }
      .tf-options { flex-direction: column; }
      .question-card { padding: 24px 18px; }
      .results-card { padding: 36px 20px; }
    }
  </style>
</head>
<body>

<!-- USER BADGE -->
<div id="user-badge">
  <img id="user-foto" src="pfp/p1.svg" alt="avatar">
  <div class="user-info">
    <span class="user-name" id="user-apodo">---</span>
    <span class="user-points" id="user-points">⭐ 0</span>
  </div>
</div>

<!-- BACK BAR -->
<div class="back-bar">
  <a class="btn-back" href="https://losandeleros.onrender.com">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Volver
  </a>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-glow"></div>
  <div class="hero-label">General Knowledge</div>
  <h1>World Quiz<br>Challenge</h1>
  <p>25 preguntas sobre ciencia, historia, geografía y cultura. ¡Una a la vez!</p>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-meta">
    <span id="progressText">Question 1 of 25</span>
    <strong id="progressPct">0%</strong>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- STAGE -->
<div class="stage" id="stage"></div>

<!-- RESULTS -->
<div class="results" id="results">
  <div class="results-card">
    <div class="score-ring-wrap">
      <svg class="score-ring-svg" width="160" height="160" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="80" cy="80" r="70"/>
        <circle class="ring-fill" id="ringFill" cx="80" cy="80" r="70"/>
      </svg>
      <div class="score-inner">
        <div class="score-pct" id="scorePct">0%</div>
        <div class="score-label">Score</div>
      </div>
    </div>
    <h2 id="resultsTitle">¡Quiz completo!</h2>
    <p id="resultsMsg"></p>
    <div class="r-grid">
      <div class="r-box g"><div class="rv" id="statCorrect">0</div><div class="rl">Correct</div></div>
      <div class="r-box r"><div class="rv" id="statWrong">0</div><div class="rl">Wrong</div></div>
      <div class="r-box y"><div class="rv" id="statScore">0%</div><div class="rl">Score</div></div>
    </div>
    <button class="btn-retry" onclick="retryQuiz()">↺ Try Again</button>
  </div>
</div>

<script>
const questions = [
  { type:'mc', text:'Which planet is the largest in our Solar System?', options:['Earth','Jupiter','Saturn','Neptune'], correct:1 },
  { type:'mc', text:'Who painted the Mona Lisa?', options:['Michelangelo','Raphael','Leonardo da Vinci','Caravaggio'], correct:2 },
  { type:'mc', text:'What is the capital city of Australia?', options:['Sydney','Melbourne','Brisbane','Canberra'], correct:3 },
  { type:'mc', text:'How many bones does an adult human body have?', options:['196','206','216','226'], correct:1 },
  { type:'mc', text:'Which element has the chemical symbol "Au"?', options:['Silver','Aluminum','Gold','Argon'], correct:2 },
  { type:'mc', text:'In which year did World War II end?', options:['1943','1944','1945','1946'], correct:2 },
  { type:'mc', text:'What is the longest river in the world?', options:['Amazon','Yangtze','Mississippi','Nile'], correct:3 },
  { type:'mc', text:'Who wrote "Romeo and Juliet"?', options:['Charles Dickens','William Shakespeare','Jane Austen','Mark Twain'], correct:1 },
  { type:'mc', text:'Which country invented the printing press?', options:['China','England','Germany','France'], correct:2 },
  { type:'mc', text:'What is the speed of light (approx.) in km/s?', options:['150,000','300,000','450,000','600,000'], correct:1 },
  { type:'mc', text:'The Great Barrier Reef is located off the coast of which country?', options:['South Africa','Brazil','New Zealand','Australia'], correct:3 },
  { type:'mc', text:'Which scientist developed the theory of general relativity?', options:['Isaac Newton','Niels Bohr','Albert Einstein','Stephen Hawking'], correct:2 },
  { type:'mc', text:'What is the official language of Brazil?', options:['Spanish','English','French','Portuguese'], correct:3 },
  { type:'mc', text:'How many continents are there on Earth?', options:['5','6','7','8'], correct:2 },
  { type:'mc', text:'Which organ in the human body produces insulin?', options:['Liver','Pancreas','Kidney','Stomach'], correct:1 },
  { type:'tf', text:'The Great Wall of China is visible from space with the naked eye.', correct:false },
  { type:'tf', text:'Lightning never strikes the same place twice.', correct:false },
  { type:'tf', text:'Mount Everest is the tallest mountain on Earth above sea level.', correct:true },
  { type:'tf', text:'Sharks are mammals.', correct:false },
  { type:'tf', text:'The Eiffel Tower is located in Paris, France.', correct:true },
  { type:'tf', text:'Diamonds are the hardest natural substance on Earth.', correct:true },
  { type:'tf', text:'The Pacific Ocean is the largest ocean in the world.', correct:true },
  { type:'tf', text:'Napoleon Bonaparte was shorter than the average Frenchman of his time.', correct:false },
  { type:'tf', text:'Bats are blind.', correct:false },
  { type:'tf', text:'Water boils at 100°C at sea level.', correct:true },
];

const L = ['A','B','C','D'];
let current = 0, score = 0, answered = false;
let quizPoints = 0;

function updateProgress() {
  const pct = Math.round((current / questions.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Question ${Math.min(current+1, questions.length)} of ${questions.length}`;
  document.getElementById('progressPct').textContent = pct + '%';
}

function renderQuestion(idx) {
  answered = false;
  const q = questions[idx];
  const badge = q.type === 'mc'
    ? `<span class="q-badge badge-mc">Multiple Choice</span>`
    : `<span class="q-badge badge-tf">True / False</span>`;

  let opts = '';
  if (q.type === 'mc') {
    opts = `<div class="options">` + q.options.map((o,j) => `
      <div class="option" id="opt-${j}" onclick="selectMC(${j})">
        <span class="opt-letter">${L[j]}</span>
        <span class="opt-text">${o}</span>
      </div>`).join('') + `</div>`;
  } else {
    opts = `<div class="tf-options">
      <button class="tf-btn" id="tf-true" onclick="selectTF(true)">✓ &nbsp;True</button>
      <button class="tf-btn" id="tf-false" onclick="selectTF(false)">✗ &nbsp;False</button>
    </div>`;
  }

  const isLast = idx === questions.length - 1;
  document.getElementById('stage').innerHTML = `
    <div class="question-card" id="qcard">
      <div class="q-meta">
        <div class="q-num">${idx+1}</div>
        ${badge}
      </div>
      <div class="q-text">${q.text}</div>
      ${opts}
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <button class="btn-next" id="btnNext" onclick="nextQuestion()">
          ${isLast ? 'See Results →' : 'Next Question →'}
        </button>
      </div>
    </div>`;
  updateProgress();
}

function selectMC(oi) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const ok = oi === q.correct;
  if (ok) {
    score++;
    quizPoints += 125;
    if (currentUser) {
      currentUser.points = (currentUser.points || 0) + 125;
      updatePointsOnServer(currentUser.points);
    }
  }
  for (let j = 0; j < q.options.length; j++) document.getElementById(`opt-${j}`).classList.add('locked');
  document.getElementById(`opt-${q.correct}`).classList.add('correct');
  if (!ok) {
    document.getElementById(`opt-${oi}`).classList.add('wrong');
    showFeedback(false, `Incorrect. The correct answer is <strong>${L[q.correct]}. ${q.options[q.correct]}</strong>.`);
  } else showFeedback(true, 'Correct! Well done. 🎉');
  document.getElementById('btnNext').classList.add('visible');
}

function selectTF(val) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const ok = val === q.correct;
  if (ok) {
    score++;
    quizPoints += 125;
    if (currentUser) {
      currentUser.points = (currentUser.points || 0) + 125;
      updatePointsOnServer(currentUser.points);
    }
  }
  const t = document.getElementById('tf-true'), f = document.getElementById('tf-false');
  t.classList.add('locked'); f.classList.add('locked');
  (q.correct ? t : f).classList.add('correct');
  if (!ok) {
    (val ? t : f).classList.add('wrong');
    showFeedback(false, `Incorrect. The correct answer is <strong>${q.correct ? 'True' : 'False'}</strong>.`);
  } else showFeedback(true, 'Correct! Well done. 🎉');
  document.getElementById('btnNext').classList.add('visible');
}

function showFeedback(ok, msg) {
  const fb = document.getElementById('feedback');
  fb.innerHTML = (ok ? '✓ ' : '✗ ') + msg;
  fb.className = `feedback show ${ok ? 'correct-fb' : 'wrong-fb'}`;
}

function nextQuestion() {
  const card = document.getElementById('qcard');
  card.classList.add('card-exit');
  setTimeout(() => {
    current++;
    if (current >= questions.length) showResults();
    else renderQuestion(current);
  }, 260);
}

function showResults() {
  document.getElementById('stage').innerHTML = '';
  document.querySelector('.progress-wrap').style.display = 'none';
  const pct = Math.round((score / questions.length) * 100);
  const r = document.getElementById('results');
  r.classList.add('show');
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = questions.length - score;
  document.getElementById('statScore').textContent = pct + '%';
  document.getElementById('scorePct').textContent = pct + '%';

  // Animate SVG ring
  const circumference = 2 * Math.PI * 70;
  const offset = circumference - (pct / 100) * circumference;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);

  let title, msg;
  if (pct >= 90) { title = '🏆 Outstanding!'; msg = 'Nearly perfect! Your general knowledge is seriously impressive.'; }
  else if (pct >= 70) { title = '🎉 Great Job!'; msg = 'Solid result! You clearly know your stuff.'; }
  else if (pct >= 50) { title = '👍 Not Bad!'; msg = 'Decent score — keep learning and try again!'; }
  else { title = '📚 Keep Studying!'; msg = "There's room to grow. Give it another shot!"; }
  document.getElementById('resultsTitle').textContent = title;
  document.getElementById('resultsMsg').textContent = msg;
  
  r.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function retryQuiz() {
  current = 0; score = 0; answered = false; quizPoints = 0;
  document.getElementById('results').classList.remove('show');
  document.querySelector('.progress-wrap').style.display = '';
  document.getElementById('ringFill').style.strokeDashoffset = 439.8;
  renderQuestion(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 👤 Cargar datos del usuario */
let currentUser = null;
async function updatePointsOnServer(newPoints) {
  if (!currentUser) return;
  try {
    const res = await fetch(`/update/${currentUser.ide}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ points: newPoints })
    });
    if (res.ok) {
      const data = await res.json();
      currentUser.points = data.points;
      document.getElementById("user-points").textContent = "⭐ " + data.points;
    }
  } catch(e) {
    console.error("Error updating points:", e);
  }
}

async function initAccount() {
  const ide = localStorage.getItem("andeleros_last_active");
  if (!ide) {
    window.location.href = "index.html";
    return;
  }
  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ide })
    });
    if (res.ok) {
      currentUser = await res.json();
      document.getElementById("user-apodo").textContent = currentUser.apodo;
      document.getElementById("user-foto").src = currentUser.foto;
      document.getElementById("user-points").textContent = "⭐ " + (currentUser.points || 0);
      document.getElementById("user-badge").style.display = "flex";
    } else {
      window.location.href = "index.html";
    }
  } catch(e) {
    window.location.href = "index.html";
  }
}
initAccount();

renderQuestion(0);
</script>
