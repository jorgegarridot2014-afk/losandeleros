<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body {
  margin: 0;
  font-family: 'Courier New', monospace;
  background: linear-gradient(135deg, #0a0a0a 0%, #050505 100%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  text-align: center;
  background: rgba(255,255,255,0.03);
  border: 1px solid #00ffff33;
  border-radius: 20px;
  padding: 40px 30px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(0,255,255,0.1);
}

.glow {
  font-size: 32px;
  color: #00ffff;
  text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff55;
  margin-bottom: 30px;
  letter-spacing: 2px;
}

.subtitle {
  color: #888;
  font-size: 14px;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  grid-gap: 12px;
  margin: 25px auto;
  width: max-content;
}

.key {
  background: #111;
  border: 2px solid #00ffff55;
  border-radius: 12px;
  padding: 18px;
  font-size: 22px;
  color: #00ffff;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: bold;
}

.key:hover {
  background: #00ffff;
  color: #000;
  box-shadow: 0 0 15px #00ffff;
}

.key:active {
  transform: scale(0.92);
}

.key.del {
  border-color: #ff660055;
  color: #ff6600;
}

.key.del:hover {
  background: #ff6600;
  color: #000;
  box-shadow: 0 0 15px #ff6600;
}

.key.enter {
  border-color: #00ff9955;
  color: #00ff99;
  grid-column: span 2;
}

.key.enter:hover {
  background: #00ff99;
  color: #000;
  box-shadow: 0 0 15px #00ff99;
}

#displayCode {
  font-size: 28px;
  letter-spacing: 15px;
  margin: 20px 0 25px;
  color: #00ffff;
  font-family: monospace;
  text-shadow: 0 0 8px #00ffff55;
}

#messageInput {
  width: 90%;
  max-width: 380px;
  padding: 14px 18px;
  font-size: 16px;
  border: 2px solid #00ffff55;
  border-radius: 12px;
  background: #050505;
  color: #00ffff;
  margin: 15px 0;
  display: none;
  font-family: 'Courier New', monospace;
}

#messageInput::placeholder {
  color: #444;
}

#sendMessage {
  display: none;
  background: #00ff99;
  color: #000;
  border: none;
  padding: 12px 30px;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  margin: 15px 0;
}

#sendMessage:hover {
  background: #00dd88;
  box-shadow: 0 0 15px #00ff99;
}

.status {
  font-size: 12px;
  color: #00ff99;
  margin-top: 15px;
  opacity: 0;
  transition: opacity 0.3s;
}

.status.connected {
  opacity: 1;
}
</style>
</head>

<body>

<div class="box">

  <h1 class="glow">🛠 PANEL ADMIN</h1>
  <p class="subtitle">> Acceso restringido - Identificación requerida</p>
  
  <div id="authSection">
    <p style="color:#aaa; font-size:13px; margin-bottom:10px;">INTRODUCE CLAVE DE ACCESO:</p>
    <div id="displayCode">_____</div>
    <div class="keypad">
      <div class="key" onclick="addDigit('1')">1</div>
      <div class="key" onclick="addDigit('2')">2</div>
      <div class="key" onclick="addDigit('3')">3</div>
      <div class="key" onclick="addDigit('4')">4</div>
      <div class="key" onclick="addDigit('5')">5</div>
      <div class="key" onclick="addDigit('6')">6</div>
      <div class="key" onclick="addDigit('7')">7</div>
      <div class="key" onclick="addDigit('8')">8</div>
      <div class="key" onclick="addDigit('9')">9</div>
      <div class="key del" onclick="clearCode()">⌫</div>
      <div class="key enter" onclick="checkCode()">INTRO</div>
    </div>
  </div>

  <div id="messageSection" style="display:none;">
    <p style="color:#00ff99; margin-bottom:15px;">✓ Acceso concedido - Mensaje en tiempo real</p>
    <input id="messageInput" type="text" placeholder="Escribe mensaje para todos los usuarios...">
    <br>
    <button id="sendMessage" onclick="sendBroadcast()">ENVIAR MENSAJE</button>
    <br><br>
    <button onclick="volver()" style="background:#333; color:#aaa;">VOLVER</button>
    <div id="status" class="status">Conectado</div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let enteredCode = "";
const CORRECT_CODE = "678931";

function addDigit(d) {
  if (enteredCode.length < 6) {
    enteredCode += d;
    updateDisplay();
  }
}

function clearCode() {
  enteredCode = "";
  updateDisplay();
}

function updateDisplay() {
  const display = document.getElementById("displayCode");
  let shown = "";
  for (let i = 0; i < 6; i++) {
    shown += i < enteredCode.length ? enteredCode[i] : "_";
  }
  display.innerText = shown;
}

function checkCode() {
  if (enteredCode === CORRECT_CODE) {
    document.getElementById("authSection").style.display = "none";
    document.getElementById("messageSection").style.display = "block";
    document.getElementById("messageInput").style.display = "block";
    document.getElementById("sendMessage").style.display = "inline-block";
    document.getElementById("messageInput").focus();
    
    const status = document.getElementById("status");
    status.classList.add("connected");
  } else {
    enteredCode = "";
    updateDisplay();
  }
}

const socket = io();

socket.on("connect", () => {
  console.log("✅ Conectado al servidor Socket.IO");
});

socket.on("connect_error", (err) => {
  console.error("❌ Error conexión Socket.IO:", err);
});

function sendBroadcast() {
  const msg = document.getElementById("messageInput").value.trim();
  if (msg) {
    console.log("📤 Enviando mensaje:", msg);
    socket.emit("admin-message", { user: "admin", message: msg });
    document.getElementById("messageInput").value = "";
  }
}

document.getElementById("messageInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    sendBroadcast();
  }
});

function volver(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
