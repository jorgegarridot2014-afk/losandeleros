<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Los Andeleros</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  display:flex;
}

/* IZQUIERDA = JUEGO */
#game{
  width:70%;
  height:100vh;
  background:#222;
  position:relative;
  overflow:hidden;
}

/* DERECHA = TIMER */
#panel{
  width:30%;
  padding:20px;
  background:#000;
}

#player{
  width:40px;
  height:40px;
  background:#0f0;
  position:absolute;
  bottom:50px;
  left:50px;
}

.obstacle{
  width:30px;
  height:50px;
  background:red;
  position:absolute;
  bottom:50px;
}

/* texto */
h1{
  font-size:20px;
}

</style>
</head>

<body>

<!-- JUEGO -->
<div id="game">
  <div id="player"></div>
</div>

<!-- PANEL DERECHO -->
<div id="panel">
  <h1>⏳ Cuenta atrás</h1>
  <h2 id="timer">Cargando...</h2>

  <hr>

  <h1>🎮 Los Andeleros</h1>
  <p>Toca la pantalla para saltar</p>
</div>

<script>

// ----------- TIMER -----------

function actualizarTimer(){
  const ahora = new Date();

  const objetivo = new Date();
  objetivo.setDate(ahora.getDate() + ((6 - ahora.getDay() + 7) % 7));
  objetivo.setHours(17,30,0,0);

  const diff = objetivo - ahora;

  if(diff <= 0){
    document.getElementById("timer").innerText = "¡YA ES SÁBADO!";
    return;
  }

  const horas = Math.floor(diff / (1000*60*60));
  const minutos = Math.floor((diff / (1000*60)) % 60);
  const segundos = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").innerText =
    horas + "h " + minutos + "m " + segundos + "s";
}

setInterval(actualizarTimer, 1000);
actualizarTimer();


// ----------- JUEGO -----------

const player = document.getElementById("player");
const game = document.getElementById("game");

let saltando = false;
let velocidad = 5;
let jugando = true;

function saltar(){
  if(saltando) return;

  saltando = true;
  let altura = 0;

  let subir = setInterval(()=>{
    altura += 5;
    player.style.bottom = (50 + altura) + "px";

    if(altura >= 100){
      clearInterval(subir);

      let bajar = setInterval(()=>{
        altura -= 5;
        player.style.bottom = (50 + altura) + "px";

        if(altura <= 0){
          clearInterval(bajar);
          saltando = false;
        }
      },20);

    }
  },20);
}

// CLICK o TOUCH (móvil)
document.addEventListener("click", saltar);
document.addEventListener("touchstart", saltar);


// obstáculos
function crearObstaculo(){
  if(!jugando) return;

  const obs = document.createElement("div");
  obs.classList.add("obstacle");

  obs.style.left = "100%";
  game.appendChild(obs);

  let pos = window.innerWidth * 0.7;

  let mover = setInterval(()=>{
    pos -= velocidad;
    obs.style.left = pos + "px";

    // colisión
    const playerRect = player.getBoundingClientRect();
    const obsRect = obs.getBoundingClientRect();

    if(
      playerRect.right > obsRect.left &&
      playerRect.left < obsRect.right &&
      playerRect.bottom > obsRect.top
    ){
      alert("💀 PERDISTE");
      location.reload();
    }

    if(pos < -50){
      clearInterval(mover);
      obs.remove();
    }

  },20);

  setTimeout(crearObstaculo, 1500);
}

crearObstaculo();

</script>

</body>
</html>
