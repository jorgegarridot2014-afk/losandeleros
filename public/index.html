<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="sesion"></h2>

<div id="menuTop"></div>

<button id="volver" onclick="volver()" style="display:none;">⬅ Volver</button>

<div id="panel"></div>
<div id="mensaje"></div>

<!-- BOTONES FIJOS -->
<button id="modo" onclick="cambiarModo()">Modo</button>
<button id="perfil" onclick="abrirPerfil()">Perfil</button>
<button id="musica" onclick="toggleMusica()">🎵</button>

<!-- PERFIL -->
<div id="perfilBox">
  <div class="contenido">
    <h3>Perfil</h3>

    <img id="avatarGrande" width="100"><br><br>

    <p>Nombre: <span id="nombre"></span></p>
    <p>ID: <span id="miID"></span></p>

    <h4>Cambiar foto</h4>
    <img src="https://i.pravatar.cc/100?img=1" width="50" onclick="cambiarAvatar(this.src)">
    <img src="https://i.pravatar.cc/100?img=2" width="50" onclick="cambiarAvatar(this.src)">
    <img src="https://i.pravatar.cc/100?img=3" width="50" onclick="cambiarAvatar(this.src)">

    <br><br>
    <button onclick="cerrarPerfil()">Cerrar</button>
  </div>
</div>

<!-- AUDIO -->
<audio id="audio" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script src="login.js"></script>
</body>
</html>
