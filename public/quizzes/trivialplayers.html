<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Multiplayer - Cultura General</title>
<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  overflow:hidden;
}

#bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, #00ffcc33, transparent 40%),
    radial-gradient(circle at 80% 80%, #ff00ff33, transparent 40%),
    #050505;
  animation:pulse 6s infinite alternate;
  z-index:-2;
}

@keyframes pulse{
  100%{filter:brightness(1.3);}
}

#menu,#box,#lobby,#create-screen,#join-screen{
  width:420px;
  padding:18px;
  background:rgba(255,255,255,0.06);
  border-radius:14px;
  text-align:center;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(0,255,150,0.25);
}

button{
  width:100%;
  margin:5px 0;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:linear-gradient(90deg,#00ff99,#00ccff);
  font-weight:bold;
}

button:hover{
  transform:scale(1.05);
}

#timer{
  font-size:20px;
  color:yellow;
}

#hint{
  font-size:12px;
  color:#00d9ff;
}

#points{
  position:fixed;
  top:8px;
  right:8px;
  background:rgba(0,0,0,0.5);
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #00ffcc;
}

#user-badge {
  position: fixed;
  top: 8px;
  left: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0, 0, 0, 0.6);
  padding: 5px 15px;
  border-radius: 25px;
  border: 1px solid #00ffcc;
  z-index: 10;
}

#user-badge img {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid #00ffcc;
}

#popup{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.7);
  z-index: 5000;
}

#popupBox{
  width:200px;
  padding:15px;
  background:#111;
  border-radius:10px;
  text-align:center;
  border:1px solid #00ffcc;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,0.2);
  border-top:4px solid #00ffcc;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

#intro-cinematic {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 2000;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  font-family: 'Courier New', Courier, monospace;
  color: #00ffcc;
  text-align: center;
}

.typewriter {
  overflow: hidden;
  white-space: nowrap;
  border-right: .15em solid #00ffcc;
  animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
}

@keyframes typing { from { width: 0 } to { width: 100% } }
@keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #00ffcc } }

.btn-correct {
  background: #00ff99 !important;
  box-shadow: 0 0 15px #00ff99;
  transform: scale(1.05);
}

.btn-wrong {
  background: #ff0055 !important;
  box-shadow: 0 0 15px #ff0055;
  opacity: 0.8;
}

.game-item {
  background: rgba(0,0,0,0.3);
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: 1px solid #00ffcc;
  cursor: pointer;
}

.game-item:hover {
  background: rgba(0,255,204,0.2);
}

#players-list {
  text-align: left;
  margin: 10px 0;
  max-height: 150px;
  overflow-y: auto;
}

.player-item {
  padding: 5px;
  margin: 3px 0;
  background: rgba(0,0,0,0.3);
  border-radius: 5px;
  font-size: 14px;
}

#winner-box {
  background: rgba(0,255,204,0.1);
  padding: 15px;
  border-radius: 10px;
  margin: 10px 0;
  border: 1px solid #00ffcc;
}
</style>
</head>
<body>

<div id="bg"></div>

<div id="intro-cinematic">
  <h1 class="typewriter">MULTIPLAYER QUIZ: LOADING...</h1>
  <p style="opacity:0.6; font-size: 12px; margin-top: 20px;">[ INITIALIZING MULTIPLAYER INTERFACE ]</p>
</div>

<div id="user-badge" style="display:none;">
  <img id="user-foto" src="pfp/p1.svg">
  <span id="user-apodo">---</span>
</div>

<div id="points">⭐ Cargando...</div>

<div id="menu">
  <h2>🎮 QUIZ MULTIPLAYER</h2>
  <button onclick="showCreateScreen()">🎮 Crear Partida</button>
  <button onclick="showJoinScreen()">🔍 Unirse a Partida</button>
  <button onclick="window.location.href='/quizzes/quiz.html'">🧠 Quiz Individual</button>
  <button onclick="window.location.href='/index.html'" style="background: #333; margin-top: 15px; border: 1px solid #555;">⬅️ Volver al Menú Principal</button>
</div>

<div id="create-screen" style="display:none;">
  <h2>🎮 Crear Partida</h2>
  <p style="font-size:14px; margin:15px 0;">Selecciona temática:</p>
  <button onclick="createGame('general')">📚 Cultura General</button>
  <button onclick="goHome()" style="background: #333; margin-top: 15px;">⬅️ Volver</button>
</div>

<div id="join-screen" style="display:none;">
  <h2>🔍 Unirse a Partida</h2>
  <div id="games-list">
    <p>Cargando partidas...</p>
  </div>
  <button onclick="loadGames()" style="background:#222; margin-top:10px;">🔄 Actualizar</button>
  <button onclick="goHome()" style="background: #333; margin-top: 15px;">⬅️ Volver</button>
</div>

<div id="lobby" style="display:none;">
  <h2>🎮 Sala de Espera</h2>
  <p style="font-size:14px;">Partida: <span id="game-id" style="color:#00ffcc;"></span></p>
  <p style="font-size:14px;">Temática: <span style="color:#00ffcc;">Cultura General</span></p>
  <h4 style="margin-top:15px;">👥 Jugadores (<span id="player-count">1</span>/4):</h4>
  <div id="players-list"></div>
  <button id="btn-start" style="display:none; background:#00ff99; color:#000; margin-top:15px;">▶ Comenzar Partida</button>
  <button onclick="leaveLobby()" style="background: #333; margin-top: 10px;">⬅️ Salir de la sala</button>
</div>

<div id="box" style="display:none;">
  <div id="timer"></div>
  <div id="question"></div>
  <div id="hint"></div>
  <div id="answers"></div>
</div>

<div id="popup">
  <div id="popupBox">
    <div class="spinner"></div>
    <p id="popupText"></p>
    <button onclick="closePopup()">Cerrar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const LAST_ACTIVE_KEY = "andeleros_last_active";
let currentUser = null;
let points = 0;
let isUserLoaded = false;
const pointsUI = document.getElementById("points");
let currentGame = null;
let socket = null;
let socketInitialized = false;
let gameQuestions = [];
let myScore = 0;

function initSocket() {
  if (socketInitialized) return;
  socketInitialized = true;
  socket = io();
  
  socket.on("connect", () => {
    console.log("🔌 Conectado:", socket.id);
  });
  
  socket.on("game-started", (questions) => {
    gameQuestions = questions || [];
    startQuiz();
  });
  
  socket.on("player-joined", (game) => {
    refreshLobby(game);
  });
  
  socket.on("player-left", (game) => {
    refreshLobby(game);
  });
  
  socket.on("game-ended", () => {
    showResult();
  });
}

const questions = [
  {q:"¿Capital de España?",a:["Madrid","Barcelona","Sevilla","Valencia"],c:0,h:"Capital del país"},
  {q:"Planeta rojo?",a:["Venus","Marte","Júpiter","Saturno"],c:1,h:"Óxido"},
  {q:"2+2?",a:["3","4","5","6"],c:1,h:"básico"},
  {q:"Capital Francia?",a:["Roma","París","Madrid","Lisboa"],c:1,h:"Torre Eiffel"},
  {q:"Lenguaje web?",a:["Python","HTML","C++","Java"],c:1,h:"estructura web"},
  {q:"Elemento más ligero?",a:["Helio","Hidrógeno","Oxígeno","Carbono"],c:1,h:"H"},
  {q:"Velocidad luz?",a:["300k km/s","150k","100k","500k"],c:0,h:"constante"},
  {q:"Capital Italia?",a:["Roma","Milán","Venecia","Nápoles"],c:0,h:"imperio"},
  {q:"5x5?",a:["20","25","30","15"],c:1,h:"multiplicación"},
  {q:"Mona Lisa?",a:["Da Vinci","Picasso","Goya","Van Gogh"],c:0,h:"arte"},
  {q:"CPU es?",a:["Pantalla","Procesador","Teclado","RAM"],c:1,h:"cerebro"},
  {q:"Océano más grande?",a:["Atlántico","Índico","Pacífico","Ártico"],c:2,h:"muy grande"},
  {q:"Gas respiramos?",a:["Oxígeno","CO2","Helio","Hidrógeno"],c:0,h:"vida"},
  {q:"Capital Japón?",a:["Tokio","Kyoto","Osaka","Seúl"],c:0,h:"Asia"},
  {q:"HTML es?",a:["Lenguaje web","Sistema","App","IA"],c:0,h:"web"},
  {q:"Newton?",a:["Gravedad","Electricidad","Fuego","Luz"],c:0,h:"manzana"},
  {q:"Planeta grande?",a:["Júpiter","Marte","Tierra","Venus"],c:0,h:"gigante"},
  {q:"Continentes?",a:["5","6","7","8"],c:2,h:"modelo"},
  {q:"Python creado por?",a:["Guido","Elon","Jobs","Linus"],c:0,h:"programación"},
  {q:"Metal líquido?",a:["Mercurio","Oro","Plata","Hierro"],c:0,h:"tóxico"}
];

let currentQuestions = [];
let currentIndex = 0;
let score=0;
let time=60;
let interval;
let isAnswering = false;

const menu=document.getElementById("menu");
const box=document.getElementById("box");
const q=document.getElementById("question");
const a=document.getElementById("answers");
const t=document.getElementById("timer");
const h=document.getElementById("hint");

window.onload = () => {
  setTimeout(() => {
    const intro = document.getElementById("intro-cinematic");
    intro.style.transition = "opacity 1s";
    intro.style.opacity = "0";
    intro.style.pointerEvents = "none";
    setTimeout(() => intro.style.display = "none", 1000);
  }, 4000);
};

async function initAccount() {
  const ide = localStorage.getItem(LAST_ACTIVE_KEY);
  if (!ide) {
    window.location.href = "/index.html";
    return;
  }

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ide })
    });

    if (res.ok) {
      currentUser = await res.json();
      points = currentUser.points || 0;
      isUserLoaded = true;
      
      document.getElementById("user-apodo").innerText = currentUser.apodo;
      document.getElementById("user-foto").src = currentUser.foto;
      document.getElementById("user-badge").style.display = "flex";
      
      updatePointsUI(false);
      
      initSocket();
    }
  } catch(e) {
    window.location.href = "/index.html";
  }
}
initAccount();

async function updatePointsUI(save = true) {
  if (isNaN(points)) points = 0;
  pointsUI.innerText = "⭐ Puntos: " + (isUserLoaded ? points : "...");

  if (save && currentUser && isUserLoaded) {
    try {
      pointsUI.style.opacity = "0.5";
      const res = await fetch(`/update/${currentUser.ide}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ points })
      });
      if (res.ok) {
        const data = await res.json();
        currentUser.points = data.points;
      }
    } finally {
      pointsUI.style.opacity = "1";
    }
  }
}

function showCreateScreen() {
  menu.style.display = "none";
  document.getElementById("create-screen").style.display = "block";
}

function showJoinScreen() {
  menu.style.display = "none";
  document.getElementById("join-screen").style.display = "block";
  loadGames();
}

async function loadGames() {
  const list = document.getElementById("games-list");
  list.innerHTML = "<p>Cargando partidas...</p>";
  
  try {
    const res = await fetch("/games");
    const games = await res.json();
    
    if (games.length === 0) {
      list.innerHTML = "<p>No hay partidas disponibles. ¡Sé el primero en crear una!</p>";
      return;
    }
    
    list.innerHTML = "";
    games.forEach(game => {
      const div = document.createElement("div");
      div.className = "game-item";
      div.innerHTML = `
        <strong>${game.gameId}</strong><br>
        <span style="font-size:12px; color:#aaa;">Creada por: ${game.creator}</span><br>
        <span style="font-size:11px; color:#00ffcc;">${game.players.length}/4 jugadores</span>
      `;
      div.onclick = () => joinGame(game.gameId);
      list.appendChild(div);
    });
  } catch(err) {
    list.innerHTML = "<p style='color:red;'>Error al cargar partidas</p>";
  }
}

async function createGame(topic) {
  if (!isUserLoaded) return alert("Cargando datos de tu cuenta...");
  
  try {
    const res = await fetch("/create-game", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        creator: currentUser.apodo,
        creatorId: currentUser.ide,
        topic: "general"
      })
    });
    
    const data = await res.json();
    currentGame = data;
    enterLobby(data.gameId);
  } catch(err) {
    alert("Error al crear la partida");
  }
}

async function joinGame(gameId) {
  if (!isUserLoaded) return;
  
  try {
    const res = await fetch("/join-game", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        gameId,
        player: currentUser.apodo,
        playerId: currentUser.ide
      })
    });
    
    const data = await res.json();
    if (data.gameId) {
      currentGame = { gameId };
      enterLobby(gameId);
    }
  } catch(err) {
    alert("Error al unirse a la partida");
  }
}

async function enterLobby(gameId) {
  document.getElementById("create-screen").style.display = "none";
  document.getElementById("join-screen").style.display = "none";
  document.getElementById("lobby").style.display = "block";
  
  document.getElementById("game-id").innerText = gameId;
  
  await refreshLobbyData(gameId);
  
  if (socket && currentGame) {
    socket.emit("join-game", gameId);
  }
}

async function refreshLobbyData(gameId) {
  try {
    const res = await fetch("/games");
    const games = await res.json();
    const game = games.find(g => g.gameId === gameId);
    
    if (game) {
      refreshLobby(game);
    }
  } catch(err) {
    console.error("Error refreshing lobby:", err);
  }
}

function refreshLobby(game) {
  if (!game) {
    goHome();
    return;
  }
  
  document.getElementById("player-count").innerText = game.players.length;
  renderPlayers(game.players);
  
  const btnStart = document.getElementById("btn-start");
  if (game.creatorId === currentUser?.ide && game.players.length >= 1) {
    btnStart.style.display = "block";
    btnStart.onclick = () => startMultiplayerGame();
  } else if (game.players.length >= 2) {
    btnStart.style.display = "none";
  } else {
    btnStart.style.display = "none";
  }
}

function renderPlayers(players) {
  const list = document.getElementById("players-list");
  list.innerHTML = "";
  players.forEach(p => {
    const div = document.createElement("div");
    div.className = "player-item";
    div.innerText = "🎮 " + p;
    list.appendChild(div);
  });
}

async function startMultiplayerGame() {
  if (!socket || !currentGame || currentGame.gameId !== document.getElementById("game-id").innerText) return;
  
  try {
    const res = await fetch("/start-game", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        gameId: currentGame.gameId,
        playerId: currentUser.ide
      })
    });
    
    const data = await res.json();
    if (data.questions) {
      socket.emit("start-game", currentGame.gameId, data.questions);
      gameQuestions = data.questions;
      startQuiz();
    } else {
      alert(data.error || "Error al iniciar la partida");
    }
  } catch(err) {
    alert("Error al iniciar la partida");
  }
}

function startQuiz() {
  document.getElementById("lobby").style.display = "none";
  box.style.display = "block";
  
  currentQuestions = gameQuestions.length > 0 ? [...gameQuestions] : [...questions].sort(() => Math.random() - 0.5);
  currentIndex = 0;
  myScore = 0;
  time = 60;
  isAnswering = false;
  
  renderQuestion();
  timer();
}

function timer(){
  clearInterval(interval);
  interval=setInterval(()=>{
    time--;
    t.innerText="⏱️ "+time;
    if(time<=0) end();
  },1000);
}

function renderQuestion() {
  const qData = currentQuestions[currentIndex];
  q.innerText = `${currentIndex + 1}. ${qData.q}`;
  h.innerText = "💡 Pista: " + qData.h;
  a.innerHTML = "";

  qData.a.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.innerText = opt;

    btn.onclick = () => {
      if (isAnswering) return;
      isAnswering = true;

      if (idx === qData.c) {
        btn.classList.add("btn-correct");
        score++;
        myScore++;
        points += 100;
      } else {
        btn.classList.add("btn-wrong");
        points += 20;
      }

      updatePointsUI();

      setTimeout(() => {
        isAnswering = false;
        next();
      }, 600);
    };

    a.appendChild(btn);
  });
}

function next(){
  currentIndex++;
  if(currentIndex >= currentQuestions.length || time <= 0) end();
  else renderQuestion();
}

function end(){
  clearInterval(interval);
  
  q.innerHTML="🏁 FIN";
  a.innerHTML = `
    <div id="winner-box">
      <h3>¡Has terminado!</h3>
      <p>Aciertos: ${myScore}</p>
      <h4 style="color:#00ffcc;">Puntos ganados: ${points} ⭐</h4>
    </div>
    <button onclick="goHome()">🏠 Ir al Menú</button>
  `;
  h.innerHTML="";
  t.innerHTML="";
}

async function leaveLobby() {
  if (!currentGame) return goHome();
  
  try {
    await fetch("/leave-game", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        gameId: currentGame.gameId,
        playerId: currentUser.ide
      })
    });
  } catch(err) {
    console.error("Error leaving game:", err);
  }
  
  goHome();
}

function goHome(){
  box.style.display = "none";
  document.getElementById("lobby").style.display = "none";
  document.getElementById("join-screen").style.display = "none";
  document.getElementById("create-screen").style.display = "none";
  menu.style.display = "block";
  currentGame = null;
}

function showPopup(text){
  document.getElementById("popupText").innerText=text;
  document.getElementById("popup").style.display="flex";
}

function closePopup(){
   document.getElementById("popup").style.display="none";
 }

 socket.on("admin-broadcast", (data) => {
   alert(data.user + ": " + data.message);
 });

</script>

</body>
</html>
