<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AppUsuarios</title>

<!-- 🔥 ANTI CACHE -->
<link rel="stylesheet" href="/style.css?v=9999">

</head>
<body>

<!-- PRIVACIDAD -->
<div id="privacidad" class="hidden">
  <p>
  Política de privacidad<br><br>
  Esta web guarda un apodo y un ID de usuario generado automáticamente.<br>
  No se recogen datos personales.<br>
  No se comparten datos con terceros.<br>
  Puedes eliminar tu cuenta en cualquier momento.
  </p>

  <button onclick="aceptarPrivacidad()">Aceptar</button>
  <button onclick="rechazarPrivacidad()">Rechazar</button>

  <br><br>

  <label>
    <input type="checkbox" id="noMostrar">
    No volver a mostrar
  </label>
</div>

<!-- NOTIFICACIONES -->
<div id="notiPanel" class="hidden">
  <p>Es posible que esta semana estemos en mantenimiento</p>
  <button onclick="cerrarNoti()">Volver</button>
</div>

<h2 id="estado">No logueado</h2>

<!-- BOTÓN NOTIFICACIONES -->
<button id="btnNoti" class="hidden" onclick="abrirNoti()">Notificaciones</button>

<!-- MENU -->
<div id="menu">
  <button onclick="irCrear()">Crear cuenta</button>
  <button onclick="irLogin()">Login</button>
</div>

<!-- CREAR -->
<div id="crear" class="hidden">
  <input id="apodo" placeholder="Apodo">
  <button onclick="crear()">Crear</button>
  <button onclick="volver()">Volver</button>
</div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <input id="ide" placeholder="ID">
  <button onclick="login()">Entrar</button>
  <button onclick="volver()">Volver</button>
</div>

<!-- PERFIL -->
<div id="perfil" class="hidden">
  <h3 id="pApodo"></h3>
  <p id="pID"></p>
  <button onclick="eliminarCuenta()">Eliminar cuenta</button>
  <button onclick="volver()">Volver</button>
</div>

<!-- CUENTAS GUARDADAS -->
<div id="bloqueGuardadas">
  <h3>Cuentas guardadas</h3>
  <div id="guardadas"></div>
</div>

<!-- BARRA -->
<div id="barra">
  <button id="btnPerfil" class="hidden" onclick="irPerfil()">Perfil</button>
  <button id="btnEntrarJuego" class="hidden" onclick="abrirJuego()">Entrar</button>
  <button id="btnLogout" class="hidden" onclick="logout()">Cerrar sesión</button>
  <button onclick="modo()">Modo</button>
</div>

<!-- 🔥 SCRIPT ANTI CACHE -->
<script src="/login.js?v=9999"></script>

</body>
</html>
