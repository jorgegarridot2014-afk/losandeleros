<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mantenimiento - Los Andeleros</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  background: radial-gradient(circle at top, #0a0a0a, #000000);
  color:white;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
}

/* brillo oscuro de fondo */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,0,0,0.08), transparent),
    radial-gradient(circle at 80% 70%, rgba(0,255,255,0.06), transparent);
  pointer-events:none;
}

/* TITULO */
h1{
  color:#ff2b2b;
  text-shadow:0 0 15px red;
  font-size:34px;
  margin-bottom:10px;
  animation: flicker 2s infinite;
}

p{
  font-size:18px;
  opacity:0.85;
  line-height:1.6;
}

/* BOTONES */
#botones{
  position:fixed;
  bottom:40px;
  display:flex;
  gap:20px;
}

button{
  padding:14px 22px;
  border:1px solid rgba(255,0,0,0.6);
  background:rgba(0,0,0,0.6);
  color:#ff3b3b;
  cursor:pointer;
  border-radius:12px;
  font-size:15px;
  transition:0.25s;
  backdrop-filter: blur(8px);
}

button:hover{
  transform:scale(1.08);
  background:#ff3b3b;
  color:black;
  box-shadow:0 0 20px red;
}

/* glitch leve */
@keyframes flicker{
  0%{opacity:1;}
  45%{opacity:0.7;}
  50%{opacity:1;}
  100%{opacity:0.8;}
}
</style>
</head>

<body>

<h1>⚠ Sistema en mantenimiento</h1>

<p>
Lo sentimos, estamos trabajando en el sistema.<br>
Queda poco ya…
</p>

<div id="botones">
  <button onclick="irEscape()">Escape Room</button>
  <button onclick="irMini()">Minijuegos</button>
</div>

<script>
function irEscape(){
  window.location.href = "https://darkterminal.onrender.com/";
}

function irMini(){
  window.location.href = "https://magomagioso-bit.github.io/losandeleros-minijuegos/";
}
</script>

</body>
</html>
