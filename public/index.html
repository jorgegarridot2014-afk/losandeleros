<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Web</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TEXTO SESIÓN -->
  <div id="sesion">No has iniciado sesión</div>

  <!-- BOTONES PRINCIPALES -->
  <div id="menu">
    <button onclick="mostrar('crear')">Crear cuenta</button>
    <button onclick="mostrar('login')">Iniciar sesión</button>
    <button onclick="mostrar('buscar')">Recuperar cuenta</button>
    <button onclick="entrar()">Entrar</button>
    <button onclick="logout()">Cerrar sesión</button>
  </div>

  <!-- PANEL DINÁMICO -->
  <div id="panel"></div>

  <!-- BOTÓN MODO -->
  <button id="modo" onclick="cambiarModo()">Modo</button>

  <!-- BOTÓN PERFIL -->
  <button id="perfil" onclick="abrirPerfil()">Perfil</button>

  <!-- PERFIL -->
  <div id="perfilBox" style="display:none;">
    <h3 id="nombre"></h3>
    <p>ID: <span id="miID"></span></p>
    <div id="avatarGrande">😎</div>
  </div>

  <!-- 🔥 IMPORTANTE: SCRIPT AL FINAL -->
  <script src="login.js"></script>
</body>
</html>
