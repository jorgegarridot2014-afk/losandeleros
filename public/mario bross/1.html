<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 1: Infiltración Origen</title>
    <style>
        body {
            background: #000;
            color: #00d4ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 5px #00d4ff;
        }
        .terminal {
            width: 90%;
            max-width: 650px;
            border: 1px solid #00d4ff;
            padding: 30px;
            background: rgba(0, 10, 30, 0.95);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            position: relative;
            z-index: 5;
        }
        .line { margin-bottom: 12px; min-height: 1.2em; }
        .btn-action {
            background: transparent;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 20px;
            display: none;
            text-transform: uppercase;
        }
        .btn-action:hover { background: #00d4ff; color: #000; }
    </style>
</head>
<body>
    <div class="terminal">
        <div id="output"></div>
        <button id="btnContinue" class="btn-action" onclick="finalizarMision()">ESTABLECER PROTOCOLO DE INICIO</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ide = params.get('ide');
        const apodo = params.get('apodo') || "Agente";
        const pts = parseInt(params.get('points')) || 0;

        const script = [
            `> BIENVENIDO AL SISTEMA, ${apodo.toUpperCase()}.`,
            "> INICIANDO PROTOCOLO DE INFILTRACIÓN: ORIGEN.",
            "> Carl Briss: '¿Me recibes? El sistema GONJOR ha fracturado mi conciencia.'",
            "> 'Estoy atrapado en los subniveles de la estación.'",
            "> 'Necesito que conectes tu terminal al núcleo principal para darme una salida.'",
            "> 'Ten cuidado... el sistema está monitorizando cada paquete de datos.'"
        ];

        let line = 0;
        async function printScript() {
            if (line < script.length) {
                const div = document.createElement("div");
                div.className = "line";
                div.innerText = script[line];
                document.getElementById("output").appendChild(div);
                line++;
                setTimeout(printScript, 1000);
            } else {
                document.getElementById("btnContinue").style.display = "block";
            }
        }

        window.onload = printScript;

        async function finalizarMision() {
            document.getElementById("btnContinue").style.display = "none";
            const out = document.getElementById("output");
            const status = document.createElement("div");
            status.innerText = "> SINCRONIZANDO CON CARL BRISS... OK";
            out.appendChild(status);

            try {
                const res = await fetch(`/update/${encodeURIComponent(ide)}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        missionCarlBriss1: true,
                        points: pts + 25 
                    })
                });

                if (res.ok) {
                    alert("✅ Protocolo de Iniciación completado. Misión 2 desbloqueada.");
                    const m2Status = params.get('m2') || 'false';
                    window.location.href = `game.html?ide=${encodeURIComponent(ide)}&apodo=${encodeURIComponent(apodo)}&points=${pts + 25}&m1=true&m2=${m2Status}`;
                } else {
                    alert("❌ Error al sincronizar con el servidor.");
                }
            } catch (e) {
                alert("⚠️ Fallo en la red de la estación.");
            }
        }
    </script>
</body>
</html>
