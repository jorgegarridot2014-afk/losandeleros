<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Hacker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #matrixCanvas {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
  }
  #screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 20px;
    background: radial-gradient(circle at center, rgba(0,20,0,0.85) 0%, rgba(0,0,0,0.95) 70%);
  }
  h1 {
    font-size: clamp(40px, 10vw, 90px); letter-spacing: 8px;
    color: #0f0; text-shadow: 0 0 18px #0f0, 0 0 40px #0f055;
    animation: glitch 2s infinite;
  }
  p { font-size: 16px; opacity: 0.9; text-shadow: 0 0 10px #0f0; letter-spacing: 3px; }
  @keyframes glitch {
    0% { text-shadow: 0 0 18px #0f0, 0 0 40px #0f055; transform: translate(0); }
    20% { text-shadow: -3px 0 #f00, 3px 0 #0ff; transform: translate(-2px, 1px); }
    40% { text-shadow: 3px 0 #f00, -3px 0 #0ff; transform: translate(2px, -1px); }
    60% { text-shadow: 0 0 18px #0f0, 0 0 40px #0f055; transform: translate(0); }
    100% { text-shadow: 0 0 18px #0f0, 0 0 40px #0f055; transform: translate(0); }
  }
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>
<div id="screen">
  <h1>MANTENIMIENTO ACTIVO</h1>
  <p>ACCESO RESTRINGIDO</p>
</div>
<script>
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()ｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ';
const fontSize = 16;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);
function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#7fff7f';
  ctx.font = (fontSize + 2) + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(draw, 30);
</script>
</body>
</html>
