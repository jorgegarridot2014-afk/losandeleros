<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="50" fill="#a855f7"/>
  
  <!-- Cabeza triangular/mago -->
  <polygon points="50,15 70,45 30,45" fill="#c084fc"/>
  
  <!-- Sombrero de mago (arriba) -->
  <polygon points="50,15 45,8 55,8" fill="#1e293b"/>
  <line x1="45" y1="8" x2="55" y2="8" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Estrella en sombrero -->
  <polygon points="50,10 52,14 56,14 53,17 54,21 50,18 46,21 47,17 44,14 48,14" fill="#fbbf24"/>
  
  <!-- Cara en triángulo -->
  <circle cx="40" cy="35" r="3" fill="#000"/>
  <circle cx="60" cy="35" r="3" fill="#000"/>
  
  <!-- Bruja sonriente -->
  <path d="M 45 40 Q 50 43 55 40" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Lunar mágico -->
  <circle cx="30" cy="38" r="2" fill="#fbbf24"/>
  
  <!-- Ropa de mago -->
  <polygon points="30,45 70,45 65,75 35,75" fill="#7c3aed"/>
  
  <!-- Detalles en ropa -->
  <circle cx="40" cy="55" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="50" cy="58" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="60" cy="55" r="2.5" fill="#fbbf24" opacity="0.7"/>
  
  <!-- Varita mágica -->
  <line x1="70" y1="45" x2="85" y2="25" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="85,25 82,28 83,32" fill="#fbbf24"/>
  <circle cx="87" cy="22" r="2.5" fill="#fbbf24"/>
  
  <!-- Chispas mágicas -->
  <circle cx="82" cy="35" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="80" cy="30" r="1" fill="#fbbf24" opacity="0.5"/>
  <circle cx="75" cy="32" r="1.5" fill="#fbbf24" opacity="0.6"/>
</svg>