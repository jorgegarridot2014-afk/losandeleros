<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CONTENEDOR */
.box {
  text-align: center;
}

/* TITULO */
.glow {
  font-size: 28px;
  color: #00ffff;
  text-shadow: 0 0 10px #00ffff;
  margin-bottom: 20px;
}

/* RUEDA */
.loader {
  border: 6px solid rgba(255,255,255,0.1);
  border-top: 6px solid #00ffff;
  border-radius: 50%;
  width: 70px;
  height: 70px;
  margin: auto;
  animation: girar 1s linear infinite;
}

@keyframes girar {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* BOTÓN */
button {
  margin-top: 25px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: #00ffff;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="box">

  <h1 class="glow">🛠 PANEL ADMIN</h1>

  <h2>⏳ Volvemos en unos momentos...</h2>

  <!-- RUEDA -->
  <div class="loader"></div>

  <br>
  <button onclick="volver()">Volver</button>

</div>

<script>
function volver(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
