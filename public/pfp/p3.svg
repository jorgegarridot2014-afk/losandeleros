  <rect x="65" y="62" width="17" height="7" rx="3" fill="#0ea5e9"/>
  
  <!-- Luces/tech -->
  <circle cx="25" cy="65" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="72" cy="65" r="2" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Antenas decorativas -->
  <line x1="40" y1="12" x2="35" y2="5" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="12" x2="65" y2="5" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <circle cx="35" cy="5" r="2" fill="#00f0ff"/>
  <circle cx="65" cy="5" r="2" fill="#00f0ff"/>
</svg>